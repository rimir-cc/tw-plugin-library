        "title": "$:/plugins/rimir/namespace",
        "description": "Namespace-aware link resolution with walk-up from title prefixes",
        "name": "namespace",
        "author": "rimir",
        "version": "0.1.21",
        "core-version": ">=5.3.0",
        "source": "https://github.com/rimir-cc/tw-namespace",
        "plugin-type": "plugin",
        "list": "readme examples settings changelog license",
        "dependents": "",
        "type": "application/json",
        "readme": "! Namespace\n\nNamespace-aware link resolution for TiddlyWiki. Replaces the core\n{{{ [[…]] }}} parser rule so link targets are resolved relative to the\nsource tiddler's own title prefix — with declarative overrides and\npluggable pseudo-segments.\n\nThe plugin is ''explicit-first'': advanced features (walk-up, aliases,\npseudo-expansion, implicit context) are all off by default and can be\ntoggled individually in the [[settings tab|$:/plugins/rimir/namespace/settings]].\nThe core mechanism — literal match + `\\context` pragma / `<$context>` widget +\nmount points — is always active.\n\n→ ''See the [[examples tab|$:/plugins/rimir/namespace/examples]]''\nfor live, in-plugin demos of every feature described below.\n\n!! Resolution pipeline\n\nA link {{{ [[REF]] }}} is resolved in this order. Stages marked ☐ are\noff by default and activated via feature flags in settings.\n\n# ''Scope gate'' — when ''Restricted'' scope is active and the source\n  tiddler is outside the whitelisted prefixes, the resolver returns\n  `out-of-scope` immediately and the link renders as vanilla TW. See\n  the //Scope// section below. Default mode //Global// makes this a\n  no-op so the rest of the pipeline runs as before.\n# ''Literal on raw REF'' — a real tiddler always beats an alias or\n  pseudo expansion. Avoids silent redirection if a tiddler and an alias\n  share a name.\n# ☐ ''Field-alias lookup'' — does any tiddler declare REF as a token in\n  its configured alias field (default `aliases`)? Single match → resolved.\n  Multiple matches → //ambiguous// (link rendered unresolved with a\n  hover-tooltip listing the colliding tiddlers and how to fix). In\n  ''Restricted'' scope mode an extra //locality narrowing// step picks a\n  single in-subtree candidate when possible — link works, tooltip still\n  surfaces the wider collision.\n# ☐ ''Alias rewrite'' — exact aliases (tiddlers tagged\n  `$:/tags/NamespaceAlias` with `short` + `expands-to` fields) and\n  pattern aliases (`$:/tags/NamespacePatternAlias`, `pattern` +\n  `replacement`). Chained up to 3 hops for cycle safety.\n# ''Mount rewrite'' — `$:/tags/NamespaceMount` with `from` / `to`.\n  Longest `from` wins; one-pass (no cascading).\n# ☐ ''Pseudo-segment expansion'' — any segment starting with `_` is\n  looked up in the pseudo-registry. Matching resolvers receive\n  `(prefix, wiki)` and return a replacement segment or null.\n# ''Literal on expanded REF'' — catches the aliased, mounted, or\n  pseudo-expanded forms.\n# ''$:/ short-circuit'' — refs starting with `$:/` are treated as\n  absolute system titles: literal-only, never contextualized or walked.\n# ''Context prefix'' — if a context is declared (see below), try\n  `<context>/REF`. When pseudo-expansion is enabled, pseudo-segments\n  inside the context are also expanded.\n# ☐ ''Self-prefix'' — try `<sourceTitle>/REF`. Resolves descendant\n  refs in deep namespaces. Walk-up never finds descendants (it only\n  walks up parents), so this is the explicit hook for that case.\n# ☐ ''Walk-up'' — walk up the source tiddler's title prefix:\n  from //source// `a/b/c/d/X`, try `a/b/c/d/REF`, `a/b/c/REF`,\n  `a/b/REF`, `a/REF`, `REF`. First hit wins.\n# ''Unresolved'' — rendered with the `ns-unresolved` class\n  (wavy underline + ⚠ marker).\n\n!! Scope\n\nBy default, the plugin operates on every tiddler in the wiki (//Global//\nmode). For users who only want namespace behavior in a specific area\n(e.g. `knowledge/...`), the [[settings tab|$:/plugins/rimir/namespace/settings]]\nexposes a ''Restricted'' mode with a list of whitelisted title prefixes\n(one per line, segment-boundary literal match — `knowledge` covers\n`knowledge` and `knowledge/...` but not `knowledgeBase/...`. Trailing\nslashes are tolerated, so `knowledge/` works identically.)\n\nOutside the whitelist, `[[REF]]` renders as a vanilla TW link — no\nwalk-up, context, alias, mount, pseudo, or self-prefix. References\ninto namespace areas from outside MUST be fully qualified by design;\nthis is what gives the namespace its encapsulation guarantee. The\nbacklinks indexer also skips out-of-scope sources. The relink rule\nstill rewrites absolute-title refs in OOS sources (a pure text match,\npreserves rename correctness) but defers the resolver-driven branches.\n\nConfig tiddlers (live, no restart):\n\n* `$:/config/rimir/namespace/scope-mode` — `global` (default) or `prefixes`\n* `$:/config/rimir/namespace/scope-prefixes` — newline-separated list\n\n!! Feature flags\n\nFive optional features can be toggled in the\n[[settings tab|$:/plugins/rimir/namespace/settings]]. All are ''off'' by\ndefault. No server restart required — toggling a flag takes effect\nimmediately.\n\n|!Flag |!What it enables |\n|Walk-up |Path-based walk-up from source tiddler (ancestors) |\n|Self-prefix |`<sourceTitle>/REF` lookup (descendants) |\n|Implicit context |`context:` field fallback (in addition to `\\context` pragma / `<$context>` widget) |\n|Pseudo expansion |`_latest` and other `_foo` pseudo-segment modules |\n|Aliases |Exact + pattern alias resolution |\n|Field aliases |Target-attached alias tokens declared in a field on each target |\n\n!! Declaring a context\n\nTwo always-on mechanisms, plus an optional field-based fallback:\n\n* ''Pragma at the top of a tiddler'' (always active):\n\n```\n\\context OWASP/ASVS/4.0.3\n\nnow [[V3.3]] resolves to OWASP/ASVS/4.0.3/V3.3\n```\n\n* ''Widget for a scoped region'' (always active):\n\n```\n<$context prefix=\"OWASP/ASVS/4.0.3\">\n  [[V3.3]] resolves here\n</$context>\nregular rendering resumes outside\n```\n\n* ''Field on the tiddler'' (requires ''implicit context'' flag):\n\n```\ntitle: my-notes\ncontext: OWASP/ASVS/4.0.3\n...\n```\n\nPriority: widget variable (from pragma or `<$context>`) wins over field.\nThat makes `\\context` an effective \"pin\" — dropping `\\context OWASP/ASVS/4.0.3`\nat the top of a doc overrides any field-based context and freezes the\ndoc's resolutions against version 4.0.3.\n\n!! Aliases — short tokens for common refs\n\nCreate a tiddler tagged `$:/tags/NamespaceAlias`:\n\n```\nshort: OWASP_V3.3\nexpands-to: OWASP/ASVS/_latest/V3.3\n```\n\nNow {{{ [[OWASP_V3.3]] }}} from anywhere resolves via the alias +\n`_latest` expansion.\n\nFor many similar refs, use a pattern alias (tag\n`$:/tags/NamespacePatternAlias`):\n\n```\npattern: ^OWASP_V(.+)$\nreplacement: OWASP/ASVS/_latest/V$1\n```\n\nNow `OWASP_V3.3`, `OWASP_V4.2`, `OWASP_V5.0`, … all resolve.\n\nExact beats pattern. See the [[examples tab|$:/plugins/rimir/namespace/examples/aliases]]\nfor live demos.\n\n!! Field aliases — alternative names on the target itself\n\nTarget-attached aliases live as a field on the tiddler they point to.\nTag-free; no extra index tiddlers. Configure the field name via\n`$:/config/rimir/namespace/alias-field` (default `aliases`):\n\n```\ntitle: project/widget\naliases: Widget [[Foo Bar]] OldName\n```\n\nNow `[[Widget]]`, `[[Foo Bar]]`, and `[[OldName]]` from anywhere all\nresolve to `project/widget`. The field is parsed as a TW title list, so\nmulti-word tokens use `[[...]]` wrapping.\n\nIf two tiddlers declare the same token, the link renders as ambiguous —\nunresolved with a `?` marker and a hover tooltip naming the colliding\ntiddlers and the field to edit. The resolver refuses to pick a winner;\nthe user is expected to remove the token from all but one target.\n\n!!! Locality narrowing (Restricted scope mode)\n\nWhen the [[Scope|$:/plugins/rimir/namespace/settings]] is set to\n//Restricted// (with whitelisted subtree prefixes), the resolver applies\nan extra step before flagging ambiguity: among the candidates, prefer\nthe one that lives in the same subtree as the source.\n\nExample: prefixes `knowledge/llm` and `knowledge/orga`. A collision on\n`Widget` declared on both `knowledge/llm/Widget` and\n`knowledge/orga/Widget` produces, from a source under `knowledge/llm`:\n\n* link navigates to `knowledge/llm/Widget` (the local pick)\n* a `·` marker on the link signals \"this is one of several\",\n* hover tooltip names the other candidates and tells the user how to\n  clean them up.\n\nBehaviour matrix:\n\n|!Candidates total |!In source's subtree |!Outcome |\n|1 |— |resolved (no marker) |\n|≥2 |exactly 1 |resolved to the local one, `·` marker + tooltip |\n|≥2 |≥2 |unresolved + diagnostic narrowed to the local conflict (with the wider collision listed as context) |\n|≥2 |0 |unresolved + diagnostic listing the full collision |\n\nIn //Global// scope mode there are no declared subtrees, so narrowing\ndoesn't apply and any collision is flagged as ambiguous. Move to\n//Restricted// when you want the resolver to lean on your scope\nprefixes for disambiguation.\n\nA real tiddler whose title equals an alias token always beats the alias\n(stage-1 literal still wins). Within the alias machinery, field-aliases\nare checked before `NamespaceAlias` rewrites — the target-attached\ndeclaration is closer to the reality of \"this tiddler answers to this\nname\" than a separate rewrite-tiddler.\n\n!! Mount points — short prefixes for deep subtrees\n\nFor a whole subtree rather than a single token, use a mount\n(tag `$:/tags/NamespaceMount`):\n\n```\nfrom: docs\nto: project-x/documentation/public\n```\n\nNow `[[docs/intro]]`, `[[docs/api/v2]]`, etc. rewrite to\n`project-x/documentation/public/intro`, `…/api/v2`, and so on. Longest\n`from` wins when multiple mounts could match. See the\n[[Mount points example|$:/plugins/rimir/namespace/examples/mounts]].\n\n!! Built-in pseudo-segments\n\n* ''`_latest`'' — resolves to the highest-version immediate child of its\n  prefix. A \"version\" is plain dotted-numeric with optional `-prerelease`\n  (`1`, `3.0`, `4.0.3`, `1.0-beta`, `2.0.0-rc.1`). Comparison is numeric\n  per segment, with releases sorting above their prereleases.\n\n!! Examples\n\n''Walk-up from a deep title.'' A tiddler titled\n`a/b/OWASP/ASVS/4.0.3/docs/intro` can write {{{ [[V3.3]] }}} and it\nresolves to `a/b/OWASP/ASVS/4.0.3/V3.3`.\n\n''`_latest` at a fixed anchor.'' A reference\n{{{ [[OWASP/ASVS/_latest/V3.3]] }}} resolves to\n`OWASP/ASVS/4.0.3/V3.3` when `4.0.3` is the highest version child under\n`OWASP/ASVS/`. Add `5.0` and the same reference re-points.\n\n''Context + bare ref.'' From any tiddler:\n\n```\n\\context OWASP/ASVS/_latest\n[[V3.3]]   ← resolves via context → OWASP/ASVS/<max>/V3.3\n[[V4.2]]   ← same, but if missing in <max>, link is unresolved\n```\n\n!! Adding your own pseudo-segment\n\nPseudo-segments are pluggable. Drop a JS module alongside or in a\ndependent plugin, declaring `module-type: rimir-ns-pseudo`:\n\n```\n/*\\\ntitle: $:/plugins/yourspace/yourname/pseudo/_first.js\ntype: application/javascript\nmodule-type: rimir-ns-pseudo\n\\*/\n\nvar util = require(\"$:/plugins/rimir/namespace/resolver.js\");\n\nexports.name = \"_first\";\n\nexports.resolve = function(prefix, wiki) {\n    if(!prefix) { return null; }\n    var kids = util.listImmediateChildren(prefix, wiki);\n    kids.sort();\n    return kids.length ? kids[0] : null;\n};\n```\n\nAfter a server restart, {{{ [[docs/_first/intro]] }}} from any source\nresolves to the alphabetically first immediate child under `docs/`.\n\n''The contract:''\n\n* `exports.name` — the full segment string, //including// the leading\n  underscore. This is what appears in the user's reference.\n* `exports.resolve(prefix, wiki)` — `prefix` is the `/`-joined segments\n  before the pseudo (empty string if pseudo is at position 0). Return\n  the replacement segment (non-empty string) or `null` to fail\n  expansion.\n\n''Utilities available from `resolver.js`:''\n\n* `listImmediateChildren(prefix, wiki)` — returns the set of immediate\n  child segments under `<prefix>/`, across regular and shadow tiddlers.\n* `splitPath(title)` — splits a title into path segments, treating\n  `$:/…` titles as a single segment.\n\nResults are cached per `(pseudoName, prefix, wiki)` triple; the cache is\ninvalidated on wiki change events whose title touches the prefix.\n\n!! How link rendering works\n\nThe wikirule converts {{{ [[REF]] }}} into:\n\n```\n<$let __nsref__=\"REF\">\n  <$link to={{{ [<__nsref__>ns-resolve<currentTiddler>] }}}\n         class={{{ [<__nsref__>ns-resolve-class<currentTiddler>] }}}>\n    text\n  </$link>\n</$let>\n```\n\nResolution happens at render time via the `ns-resolve` filter operator,\nwhich reads the `ns-context` variable (set by pragma or widget) with\nfallback to the `context` field of `currentTiddler`. Because the\n`currentTiddler` is the rendering context, references resolve correctly\nunder transclusion.\n\n!! Backlinks & tooling\n\nThe plugin maintains its own backlinks index, built from a per-tiddler\nscan that resolves every reference with the source tiddler's context.\nExposed as:\n\n* Filter operator `[<title>ns-backlinks[]]` — sources that reference\n  `<title>`.\n* Filter operator `[<title>ns-forwardlinks[]]` — targets referenced by\n  `<title>`.\n* ''NS'' tab in the tiddler info sidebar — lists both, plus a\n  ''Pin `_latest`'' button for tiddlers whose `\\context` pragma contains\n  drifting pseudos.\n\nA ''settings'' plugin tab lists all registered pseudos, aliases, and\nmount points for diagnostics.\n\n!! Relink integration\n\nWhen the [[relink plugin|https://github.com/flibbles/tw5-relink]] is\ninstalled, renaming a tiddler automatically updates:\n\n* `\\context <prefix>` pragmas where the prefix matches the old title.\n* `<$context prefix=\"...\">` widget attributes.\n* ''Namespace-resolved `[[REF]]` references'' — short refs whose\n  current resolution (literal / walk-up / context / self-prefix) points\n  to the renamed tiddler. Refs that still resolve correctly post-rename\n  are left alone. Otherwise the rule searches for the shortest suffix of\n  the new title that resolves correctly from the source (e.g. rename\n  `a/b/c/d` → `a/b/c/e` from source `a/b/c` rewrites `[[d]]` to\n  `[[e]]`). When even the full title is the only valid form, the ref\n  is pinned with a label-preserving form like `[[bar|knowledge/ai/bar]]`.\n  Absolute literal refs always rewrite cleanly:\n  `[[knowledge/llm/foo]]` → `[[knowledge/ai/foo]]`.\n\nCombined with the ''relink-titles'' companion plugin (which cascades\nrenames to child tiddlers), renaming a parent like `OWASP/ASVS` to\n`OWASP/Standards` also updates `\\context OWASP/ASVS/4.0.3` →\n`\\context OWASP/Standards/4.0.3` (because relink-titles renames the\nchild tiddler first, then relink updates the reference). Internal short\nrefs across the moved subtree get pinned to absolute on the way; once\nthe cascade settles they remain valid (and you can re-shorten manually\nif you prefer the brief form).\n\n!! Deferred\n\n* Namespace-aware transclusion `{{REF}}` — would require a full core\n  transcludeinline replacement to cover template / field / index forms.\n* Editor autocomplete for namespace-aware refs.\n\n!! Current limitations\n\n* Core TiddlyWiki's backlink index and the `relink` plugin only see the\n  literal `[[REF]]` string, not the resolved target. The plugin ships\n  its own backlinks index (see above) that resolves correctly.\n* When a tiddler with a `context:` field is transcluded from a scope\n  that set `ns-context` (via pragma or widget), the outer scope wins.\n  Workaround: add `\\context <same-value>` at the top of the inner\n  tiddler if you need it to \"own\" its context regardless.\n",
        "requires-reload": "yes",

        "title": "$:/plugins/rimir/present",

        "list": "readme documentation settings layouts changelog license",
        "type": "application/json",
        "readme": "! present\n\nFullscreen slide player for any ordered set of tiddlers. Designed as a generic presentation surface — the slide source is parameterized via a filter — with reveal.js-style 2D navigation, link-driven deep-dive (with a breadcrumb that pops you back), and a pluggable layout system.\n\n!! Key features\n\n* ''Filter-parameterized'' — pass any filter that yields slide-tiddler titles in order. No coupling to a particular content model.\n* ''2D navigation'' — `←/→` walk between //sections// (one section per group of slides), `↑/↓` walk between slides //within// the current section. Sections are derived from a configurable group-field on each slide tiddler.\n* ''Deep-dive via clicks'' — clicking a wikitext link inside a slide pushes the current location onto a navigation stack and renders the linked tiddler as an ad-hoc slide. The breadcrumb at the top shows where you came from; click any segment to pop back.\n* ''Layout system'' — `mm.slide-layout` (configurable field) maps to a layout template under `$:/plugins/rimir/present/layouts/`. Ships with `default`, `title`, `two-column`, `quote`, `image`, `full`. Author your own by adding tiddlers with the matching name.\n* ''Notes & help overlays'' — `N` toggles presenter notes (read from a configurable field). `?` opens the keyboard cheat sheet.\n* ''Engine-agnostic'' — does not depend on a mindmap, list, or any specific producer. Companion plugins (e.g. `rimir/mindmap` v0.3+) supply the filter; this plugin just plays.\n\n!! Prerequisites\n\n* TiddlyWiki 5.3.0+\n* Optional: `rimir/theme` for the shared `rr-` style hooks\n* Optional: `rimir/doc-template` for the branded documentation tab\n\n!! Quick start\n\nRender the player anywhere with a filter that yields slide-tiddler titles:\n\n```\n<$present\n    slides=\"[tag[Slides]sort[mm.slide-order]]\"\n    section-field=\"mm.slide-of\"\n    layout-field=\"mm.slide-layout\"\n    caption-field=\"caption\"\n    notes-field=\"mm.slide-notes\"\n    title=\"My deck\"\n/>\n```\n\nWrap with `$reveal` if you want to gate the overlay on a state tiddler:\n\n```\n<$reveal state=\"$:/state/rimir/present/open\" text=\"yes\" type=\"match\">\n    <$present slides={{{ [<presentation>mm-presentation-slides[]] }}} title=<<presentation>> />\n</$reveal>\n```\n\nSee the //documentation// tab for layouts, keyboard reference, and the mindmap integration.\n",

        "readme": "! realms\n\nToggle visibility of tiddler groups from the browser using TiddlyWiki filter expressions. Uses a subtract model — all tiddlers are visible by default, ticking a realm hides its matching tiddlers.\n\n!! Key features\n\n* ''Filter-based realms'' — each realm defines a TiddlyWiki filter in `realms.json`\n* ''Subtract model'' — all visible by default, tick to hide matching tiddlers\n* ''Per-request filtering'' — server keeps all tiddlers in memory, filtering at the HTTP layer\n* ''Settings UI'' — toggle realms on/off in ControlPanel with visual feedback\n* ''No restart needed'' — `realms.json` is re-read per request\n\n!! Prerequisites\n\nNo external prerequisites.\n\n!! Quick start\n\nDefine realms in `realms.json` (next to `tiddlywiki.info`):\n\n```\n{ \"work\": { \"filter\": \"[tag[Work]]\", \"description\": \"Work tiddlers\", \"active\": false } }\n```\n\nToggle visibility in ControlPanel > Settings > realms.\n",

        "readme": "! runner\n\nExecute whitelisted commands on the host machine via an HTTP route and trigger them from the browser with an action widget.\n\n!! Key features\n\n* ''Whitelist security'' — only commands defined in `runner-actions.json` can be executed\n* ''Parameterized commands'' — `{{placeholder}}` templates substituted from query params\n* ''Action widget'' — `<$api.run action=\"name\" param=\"value\"/>` for use inside `<$button>`\n* ''HTTP route'' — `GET /api/run?action=<name>` for direct invocation\n\n!! Prerequisites\n\n* Commands must be configured in `runner-actions.json` (next to `tiddlywiki.info`)\n\n!! Quick start\n\nAdd an action entry to `runner-actions.json`:\n\n```\n{ \"myaction\": { \"command\": \"echo hello\", \"description\": \"Test\" } }\n```\n\nUse in any tiddler:\n\n```\n<$button><$api.run action=\"myaction\"/>Run</$button>\n```\n",

        "source": "https://github.com/rimir-cc/tw-scattered-binaries",

        "dependents": "$:/plugins/rimir/theme",

        "type": "application/json",
        "readme": "! scattered binaries\n\nAuto-discover binary files (PDF, DOCX, XLSX, etc.) scattered across subdirectories and serve them via `_canonical_uri` tiddlers — no manual `tiddlywiki.files` needed per directory.\n\n!! Features\n\n* ''Profile-based discovery'' — configure which directories to scan via JSON profiles\n* ''Boot cleanup'' — removes duplicate tiddlers created by TW's boot scanner for binary files\n* ''HTTP route'' — serves files via configurable route prefix with path traversal protection\n* ''Meta-sidecar aware'' — skips files that have `.meta` sidecars (defers to TW native handling)\n* ''Extension filtering'' — only known binary extensions are served (blocks `.env`, `.json`, etc.)\n\n!! Optional integration\n\nWhen ''file-upload'' is also installed:\n\n* Discovered locations are automatically registered with the location registry\n* Deleting/renaming a scattered-binary tiddler cascades to derived artifacts (extractions, summaries, etc.)\n* Locations can be toggled writable via file-upload's settings UI\n\n!! Prerequisites\n\n* TiddlyWiki 5.3.0+ (Node.js server edition)\n\n!! Quick Start\n\n# Configure profiles in plugin settings (default profile scans `tiddlers/tender/#NNN/documents/`)\n# Restart TiddlyWiki — binary files are auto-discovered and registered as `_canonical_uri` tiddlers\n# Access files via the configured route prefix (e.g., `/tender-docs/%23512/filename.pdf`)\n",

    {
        "title": "$:/plugins/rimir/scribe",
        "description": "Bidirectional sync between a tiddler field (or sub-path inside a JSON-encoded field) and a state tiddler — pluggable type handlers",
        "name": "scribe",
        "author": "rimir",
        "version": "0.1.3",
        "core-version": ">=5.4.0",
        "source": "https://github.com/rimir-cc/tw-scribe",

        "type": "application/json",
        "readme": "! scribe\n\nBidirectional sync between a tiddler field (or sub-path inside a JSON-encoded field) and a state tiddler. Wraps input widgets so they can edit nested values inside a JSON field as if they were plain DataTiddler indexes.\n\n!! Key features\n\n* ''Bidirectional sync'' — state-tiddler ↔ target field, re-prepared on external changes\n* ''Sub-path support'' — sync a value at <code>path=\"0,caption\"</code> inside the JSON-encoded field, not just whole fields\n* ''Pluggable type handlers'' via <code>module-type: scribetype</code> modules\n* ''Five handlers ship'' — <code>text/plain</code>, <code>application/json</code>, <code>application/x-string-array</code>, <code>application/x-tw-date</code>, <code>application/x-tw-datetime</code>\n* ''Empty-state = delete'' — clearing the state removes the sub-path key, useful for \"un-set this property\" semantics\n* ''Zero plugin dependencies''\n\n!! Prerequisites\n\nNo external prerequisites. Optional: <code>$:/plugins/rimir/doc-template</code> for the branded documentation hub.\n\n!! Quick start\n\n```\n<$scribe tiddler=\"Task1\" field=\"kind.fields\" path=\"0,caption\" type=\"text/plain\">\n  <$edit-text tiddler=<<state>> field=\"text\" tag=\"input\"/>\n</$scribe>\n```\n\n!! Attribution\n\nThe bidirectional sync pattern was inspired by Flibbles' <code>FieldTranscriberWidget</code> in [ext[tw5-graph|https://github.com/flibbles/tw5-graph]]. This is an independent reimplementation with sub-path support added.\n",
        "requires-reload": "yes",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22darkslateblue%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%3Cpath%20d%3D%22M3%207%20L21%207%22%2F%3E%0A%3Cpath%20d%3D%22M3%2012%20L21%2012%22%2F%3E%0A%3Cpath%20d%3D%22M3%2017%20L21%2017%22%2F%3E%0A%3Cpath%20d%3D%22M8%204%20L8%2020%22%2F%3E%0A%3Cpath%20d%3D%22M16%204%20L16%2020%22%2F%3E%0A%3C%2Fsvg%3E%0A"

    {
        "title": "$:/plugins/rimir/statewrap",
        "description": "Channel-based state management with reactive rules for decoupled, reusable views",
        "name": "statewrap",
        "author": "rimir",
        "version": "0.1.7",
        "core-version": ">=5.3.0",
        "source": "https://github.com/rimir-cc/statewrap",
        "plugin-type": "plugin",
        "list": "readme documentation settings showcase changelog license",
        "dependents": "$:/plugins/rimir/theme",
        "soft-dependents": "$:/plugins/rimir/doc-template",
        "type": "application/json",
        "readme": "! Statewrap\n\nChannel-based state management for TiddlyWiki. Define named state channels in a container, and let child views read/write them by name — without knowing the underlying state tiddler paths.\n\n!! Features\n\n* ''Named channels'' — views reference logical names like `selected-project`, not `$:/state/...` paths\n* ''Reactive rules'' — declarative wikitext actions fire when a channel changes (e.g., \"when project changes, clear task selection\")\n* ''Instance isolation'' — each `<$statewrap>` gets its own state namespace via `instid` or TW's qualify mechanism\n* ''Cascading rules'' — a rule's writes trigger matching downstream rules (e.g. section → entities → details), bounded by a depth cap (10) to prevent infinite loops. Suppress with `no-rules=\"yes\"` on `<$action-statewrap-set>`.\n* ''Filter operators'' — `[statewrap-get[channel]]` reads value, `[statewrap-ref[channel]]` returns state tiddler path, `[<instid>statewrap-lookup[channel]]` reads a channel's value without needing a parent `<$statewrap>` scope (for use in `\\function` bodies, detached rendering, and introspection tools)\n\n!! Quick start\n\n```\n<$statewrap channels=\"selected-project selected-task detail-tab\"\n            default-detail-tab=\"overview\" instid=\"demo\">\n  <$statewrap-rule when=\"selected-project\">\n    <$action-statewrap-set channel=\"selected-task\" value=\"\"/>\n    <$action-statewrap-set channel=\"detail-tab\" value=\"overview\"/>\n  </$statewrap-rule>\n\n  <%if [statewrap-get[selected-project]!is[blank]]%>\n    Project: <$text text={{{[statewrap-get[selected-project]]}}}/>\n  <%endif%>\n</$statewrap>\n```\n\n!! API\n\n|!Element |!Name |!Purpose |\n|Container widget |`<$statewrap>` |Defines channels, defaults; establishes context |\n|Rule widget |`<$statewrap-rule>` |Declares reactive wikitext actions for a channel change |\n|Action widget |`<$action-statewrap-set>` |Write to a channel by name |\n|Filter operator |`[statewrap-get[channel]]` |Read a channel's current value (requires ancestor `<$statewrap>`) |\n|Filter operator |`[statewrap-ref[channel]]` |Get a channel's state tiddler path (requires ancestor `<$statewrap>`) |\n|Filter operator |`[<instid>statewrap-lookup[channel]]` |Tree-independent channel read — takes the instid as filter input, so it works outside statewrap scope |\n\n!! Prerequisites\n\nTiddlyWiki 5.3.0 or later.\n",
        "requires-reload": "yes",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22maroon%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%20%20%3Crect%20x%3D%223%22%20y%3D%223%22%20width%3D%2218%22%20height%3D%2218%22%20rx%3D%223%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%221.5%22%20fill%3D%22maroon%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%228%22%20r%3D%221.5%22%20fill%3D%22maroon%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%228%22%20cy%3D%2216%22%20r%3D%221.5%22%20fill%3D%22maroon%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%221.5%22%20fill%3D%22maroon%22%2F%3E%0A%20%20%3Cline%20x1%3D%228%22%20y1%3D%229.5%22%20x2%3D%228%22%20y2%3D%2214.5%22%2F%3E%0A%20%20%3Cline%20x1%3D%2216%22%20y1%3D%229.5%22%20x2%3D%2216%22%20y2%3D%2214.5%22%2F%3E%0A%20%20%3Cline%20x1%3D%229.5%22%20y1%3D%228%22%20x2%3D%2214.5%22%20y2%3D%228%22%2F%3E%0A%20%20%3Cline%20x1%3D%229.5%22%20y1%3D%2216%22%20x2%3D%2214.5%22%20y2%3D%2216%22%2F%3E%0A%3C%2Fsvg%3E%0A"

        "readme": "! What it does\n\nAdds a cascading ''Copy ▸'' / ''Paste ▸'' menu to `sq/streams`' right-click contextmenu. Lets you copy a stream node + its subtree as either a wiki-internal \"structure\" (round-trips losslessly) or as text in TiddlyWiki / Markdown / HTML outline format (copied to the system clipboard). Paste reads either source and creates fresh stream nodes under the right-clicked target.\n\n! Key features\n\n* ''Copy ▸ Structure'' — serialises the right-clicked node + its descendants (titles, text, hierarchy) into a TW state tiddler. Paste ▸ Structure recreates the subtree elsewhere with brand-new tiddler titles.\n* ''Copy ▸ TW-List / MD-List / HTML-List'' — writes a flat outline to the system clipboard in the chosen format.\n* ''Paste ▸ Structure'' — disabled unless the structure clipboard has content. Recreates the subtree as a new child of the right-clicked node.\n* ''Paste ▸ Text-List'' — reads the clipboard, sniffs the format (TW `*` outline, Markdown indented `-`, or HTML `<ul><li>`), parses to a tree, creates matching child nodes under the target.\n* ''Lineage stamp'' — every newly-pasted stream node carries an `orig-tiddler` field pointing at its source title (omitted for clipboard pastes — there's no source tiddler to record).\n* ''Hover tooltips'' on every menu entry (including the stock streams entries — opt-in for custom contributions via `sq-contextmenu-tooltip`).\n* ''Flatten in-place'' — the `$action-streams-flatten-inplace` widget collapses a streams subtree into a flat TW/MD/HTML outline appended to the root's text, then deletes the descendant nodes. Not exposed in the contextmenu; intended for callers that want to \"freeze\" a streams-note into a plain text/markdown/HTML note (e.g. `rimir/orga-apps` Hygiene panel).\n\n! Prerequisites\n\n* TiddlyWiki ≥ 5.4.0\n* `sq/streams` ≥ 1.2.24\n\nWithout the streams plugin installed, this plugin is inert — its `$:/plugins/sq/streams/contextmenu/contextmenu-template` override stays in the shadow store but never renders anywhere.\n\n! Quick start\n\nInstall the plugin, restart the wiki, then right-click any streams node. The cascading entries appear at the bottom of the contextmenu (above the Keyboard Shortcuts row).\n\n! How it works\n\nThis is a shadow-override of streams' `contextmenu-template`, scoped via `plugin-priority: 2` so it wins shadow precedence over the streams plugin (which ships at priority 1). Inside the override, ''`Copy ▸`'' / ''`Paste ▸`'' entries are wrapped in `<div class=\"tc-popup-keep\">` so clicking them flips the menu into sub-mode rather than dismissing the popup. The sub-mode is stored on the streams contextmenu state tiddler (`mode` field) and cleared automatically by an override of `oncontext-menu-actions` on each fresh right-click.\n\nThe actual copy/serialize/paste/parse work happens in four JS action widgets (`$action-streams-copy-structure`, `$action-streams-copy-list`, `$action-streams-paste-structure`, `$action-streams-paste-list`). The list format generator walks the `stream-list` field recursively; the paste path creates new stream-nodes via `wiki.generateNewTitle(<target>/node-<ts>)`, adding the parent to the wiki before recursing into descendants so sibling titles don't collide.\n",
        "requires-reload": "yes",

        "readme": "! theme\n\nShared visual CSS classes (prefix `rr-`) used across all rimir plugins. Provides consistent styling for tabs, panels, tables, callouts, notices, badges, forms, status messages, and the settings hub layout.\n\n!! Key features\n\n* ''Tabs'' — `rr-tabs`, `rr-tab`, `rr-tab-active` for horizontal tab bars\n* ''Callouts'' — four types (info, warning, tip, danger) via reusable template\n* ''Notices'' — alert banners (warning, info, danger, success)\n* ''Badges'' — circular and rectangular pill badges\n* ''Settings hub layout'' — sidebar + content panel classes for core-hook\n* ''Text editor'' — reusable `rr-text-editor` template with EditorToolbar shortcuts (bold, italic, headings, autolist if installed) and Ctrl+Enter to leave edit mode\n* ''Double-click-to-edit'' — companion `rr-text-view-editable` template wraps a view-mode transclude in an `$eventcatcher` that flips a caller-supplied `editState` to `\"yes\"` on dblclick\n* ''Utilities'' — muted, mono, nowrap, small helper classes\n\n!! Prerequisites\n\nNo external prerequisites.\n\n!! Quick start\n\nInstall plugin. Use `rr-` prefixed CSS classes in your tiddlers. For callouts:\n\n```\n<$transclude $tiddler=\"$:/plugins/rimir/theme/callout\" type=\"info\">\n<$fill $name=\"body\">Your message</$fill>\n</$transclude>\n```\n\n!! Class reference\n\n!!! Tabs\n\n|!Class |!Purpose |\n|`rr-tabs` |Flex container for tab bar |\n|`rr-tab` |Individual tab button |\n|`rr-tab-active` |Active tab (add alongside `rr-tab`) |\n\n```\n<div class=\"rr-tabs\">\n  <$button class=\"rr-tab rr-tab-active\">Tab 1</$button>\n  <$button class=\"rr-tab\">Tab 2</$button>\n</div>\n```\n\n!!! Panels\n\n|!Class |!Purpose |\n|`rr-panel` |Bordered container with background |\n|`rr-panel-body` |Padded inner content area |\n\n!!! Tables\n\n|!Class |!Purpose |\n|`rr-table` |Full-width collapsed table |\n|`rr-row-error` |Red background row (on `<tr>`) |\n|`rr-row-warn` |Yellow background row (on `<tr>`) |\n\n!!! Callouts\n\nUse the template `$:/plugins/rimir/theme/callout` with parameters `type` (`info`/`warning`/`tip`/`danger`) and optional `label`.\n\n|!Class |!Purpose |\n|`rr-callout` |Base callout box |\n|`rr-callout-info` |Blue left border |\n|`rr-callout-warning` |Amber left border |\n|`rr-callout-tip` |Green left border |\n|`rr-callout-danger` |Red left border |\n|`rr-callout-label` |Bold uppercase label |\n\n!!! Notices\n\nUse the template `$:/plugins/rimir/theme/notice` with parameter `type` (`warning`/`info`/`danger`/`success`).\n\n|!Class |!Purpose |\n|`rr-notice` |Base notice banner |\n|`rr-notice-warning` |Yellow background |\n|`rr-notice-info` |Light blue background |\n|`rr-notice-danger` |Light red background |\n|`rr-notice-success` |Light green background |\n\n!!! Status Messages\n\n|!Class |!Purpose |\n|`rr-status-loading` |Muted italic loading text |\n|`rr-status-error` |Red alert box |\n|`rr-status-success` |Green success box |\n|`rr-status-info` |Muted info text |\n\n!!! Badges\n\n|!Class |!Purpose |\n|`rr-badge-circle` |16px round badge |\n|`rr-badge-added` |Green circle (use with `rr-badge-circle`) |\n|`rr-badge-removed` |Red circle (use with `rr-badge-circle`) |\n|`rr-badge-rect` |Rectangular pill badge |\n\n!!! Forms\n\n|!Class |!Purpose |\n|`rr-input-row` |Flex row with gap |\n|`rr-input` |Styled text input |\n\n!!! Link Buttons\n\n|!Class |!Purpose |\n|`rr-link-btn` |Primary-colored link-style button |\n|`rr-link-btn-danger` |Alert-colored variant (add alongside `rr-link-btn`) |\n\n!!! Settings Hub\n\n|!Class |!Purpose |\n|`rr-settings-hub` |Flex container for sidebar + content layout |\n|`rr-settings-sidebar` |Left sidebar with plugin list |\n|`rr-settings-plugin-item` |Sidebar button for each plugin |\n|`rr-settings-plugin-active` |Active state highlight (accent border) |\n|`rr-settings-plugin-name` |Plugin name text (truncated) |\n|`rr-settings-plugin-version` |Version badge |\n|`rr-settings-content` |Right content area |\n|`rr-settings-header` |Plugin header with icon + name + description |\n|`rr-settings-header-name` |Plugin name in header |\n|`rr-settings-header-desc` |Plugin description in header |\n|`rr-settings-info-card` |Dashed info card for plugins without settings |\n\n!!! Text Editor\n\nUse the template `$:/plugins/rimir/theme/rr-text-editor` for an `<$edit-text>`-based body editor that picks up the standard EditorToolbar keyboard shortcuts (bold, italic, headings, autolist if the `sq/editor-autolist` plugin is installed) and binds Ctrl+Enter to clear an edit-state tiddler.\n\nCaller passes parameters via `<$let>`:\n\n|!Variable |!Required |!Purpose |\n|`editTiddler` |Yes |Title of the tiddler whose `text` field is being edited |\n|`editState` |Yes |State tiddler that gates edit mode (cleared on Ctrl+Enter) |\n|`wrapClass` |Yes |CSS class for the outer wrapper div (controls width, height, etc.) |\n|`editAutoFocus` |No |`\"yes\"` to auto-focus the textarea on mount (default `\"no\"`) |\n|`editFocusSelectFromStart` |No |Selection-start offset on auto-focus (default `99999` → past end → no selection) |\n|`editFocusSelectFromEnd` |No |Selection-end offset on auto-focus (default `0` → caret at end) |\n\n```\n<$let editTiddler=<<myNote>> editState=\"$:/state/my-edit\" wrapClass=\"my-editor\">\n<$transclude $tiddler=\"$:/plugins/rimir/theme/rr-text-editor\"/>\n</$let>\n```\n\nInternally renders toolbar children inside `<$edit-text>` so TW's framed editor engine binds shortcuts; the toolbar itself is hidden via `.rr-text-editor-host > .tc-editor-toolbar { display: none }`. Style the visible iframe via `<<wrapClass>> iframe.tc-edit-texteditor`.\n\n!!! Double-click-to-edit\n\nCompanion template `$:/plugins/rimir/theme/rr-text-view-editable` wraps a block-mode transclude in an `<$eventcatcher>` that sets a caller-supplied `editState` tiddler to `\"yes\"` on double-click — pairs with `rr-text-editor` so the same `editState` flips both directions (dblclick → enter, Ctrl+Enter → leave). Before flipping the state it fires `<$action-clear-selection>` so the dblclick word-selection is wiped — otherwise the new textarea would mount with the matching range still highlighted blue.\n\n|!Variable |!Purpose |\n|`editState` |State tiddler set to `\"yes\"` on dblclick |\n|`viewTiddler` |(Optional) tiddler to transclude. If unset, uses surrounding `<$tiddler>`/currentTiddler context |\n\n```\n<$let editState=<<myEditState>> viewTiddler=<<myNote>>>\n<$transclude $tiddler=\"$:/plugins/rimir/theme/rr-text-view-editable\" $mode=\"block\"/>\n</$let>\n```\n\nAdds class `rr-text-view-editable` (with `cursor: text`) to the wrapper div.\n\n!!! `<$action-clear-selection>`\n\nAction widget that calls `window.getSelection().removeAllRanges()`. Drop it into any action sequence that needs to wipe a stray browser text-selection (e.g. before swapping a rendered view for an editor). Used internally by `rr-text-view-editable`; usable directly anywhere actions run.\n\n```\n<$button>\n<$action-clear-selection/>\n<$action-setfield $tiddler=\"$:/state/edit\" text=\"yes\"/>\nEdit\n</$button>\n```\n\n!!! Utilities\n\n|!Class |!Purpose |\n|`rr-muted` |Muted foreground color |\n|`rr-mono` |Monospace font |\n|`rr-nowrap` |No text wrapping |\n|`rr-small` |0.85em font size |\n",
        "requires-reload": "yes",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22maroon%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%3Ccircle%20cx%3D%2213.5%22%20cy%3D%226.5%22%20r%3D%222.5%22%2F%3E%0A%3Ccircle%20cx%3D%2217.5%22%20cy%3D%2210.5%22%20r%3D%222.5%22%2F%3E%0A%3Ccircle%20cx%3D%228.5%22%20cy%3D%227.5%22%20r%3D%222.5%22%2F%3E%0A%3Ccircle%20cx%3D%226.5%22%20cy%3D%2212%22%20r%3D%222.5%22%2F%3E%0A%3Cpath%20d%3D%22M12%2022a7%207%200%200%200%207-7c0-2-1-4-3-6s-4-4-4-7a7%207%200%200%200-7%207c0%202%201%204%203%206s4%204%204%207z%22%2F%3E%0A%3C%2Fsvg%3E"

        "source": "https://github.com/rimir-cc/tw-typed",

        "dependents": "$:/plugins/rimir/theme $:/plugins/rimir/components",

        "type": "application/json",
        "readme": "! typed\n\nType system engine for TiddlyWiki. Define schemas via tiddler fields, validate instances, and create new typed tiddlers through a spawner UI.\n\n!! Key features\n\n* ''Type definitions'' — define schemas with `rrt.type` and `rrt.fields` on tiddler fields\n* ''Field definitions'' — validation rules, typed editors, calculated fields\n* ''Validator'' — UI to check all instances against their type schemas (see Validator tab)\n* ''Spawner'' — UI to create new typed tiddler instances (see Spawner tab)\n* ''Field editor'' — type-aware input controls for editing typed fields\n* ''Inheritance'' — parent types for shared field definitions\n* ''Custom filters'' — `rrfunc` filter functions for type system queries\n* ''Inline field bar'' — compact editable field display for embedding in app views\n* ''Field summary'' — read-only compact table of all typed fields with formatted values\n* ''Filter panel'' — auto-generated filter UI from field definitions (text search, enum pills, reference pills)\n* ''Filter summary'' — compact button with active filter count badge, opens filter panel in popup\n* ''`rrt-filter` operator'' — JS filter operator for generic type-aware list filtering\n\n!! Prerequisites\n\nNo external prerequisites.\n\n!! Quick start\n\nDefine a type tiddler with `rrt.type` and field definitions. Use the Spawner tab to create instances. Use the Validator tab to check for schema violations across all typed tiddlers.\n",

        "title": "$:/plugins/rimir/worga",
        "description": "Workday + orga workflows on top of cascade-palette — call / meeting / focus verbs and context-aware views",
        "name": "worga",
        "author": "rimir",
        "version": "0.0.9",
        "core-version": ">=5.4.0",
        "source": "https://github.com/rimir-cc/tw-worga",

        "type": "application/json",
        "readme": "! worga\n\nWorkday (`wor`) + organisational (`ga`) workflows layered on top of `rimir/cascade-palette`. Three demo verbs and two context-aware views demonstrate how to assemble a personal-workday flow from cp's sticky-context mechanism — pin people during a call or meeting, then watch other views narrow to topics / tasks / notes involving the pinned set.\n\nThe plugin is intentionally small. It demonstrates the integration pattern; bring your own data model (kind, orga-data-model, hand-rolled tags) and adapt the filters via the three shipped config tiddlers to match your fields.\n\n!! Key features\n\n* ''`Take call from <person>`'' action — Space on a person row → fires `Take call from …` → clears the sticky context, pins the row, AND jumps to the ''Topics for context'' view. One keystroke = ready to talk. Palette stays open (`ca-after-fire: keep`) so you can follow up immediately (take notes, pin a second person, switch to another view). Surfaces on rows with `kind.type: person` (when `rimir/kind` is installed) AND on any tiddler tagged `Person` (kind-agnostic fallback).\n* ''`Start meeting`'' leader — bound to ''`m`''. Clears the sticky context and opens the ''Pick attendees'' view.\n* ''`Pick attendees`'' view — a checkbox-style multiselect. Each row carries a ☑/☐ row icon mirroring whether that person is currently in sticky context. Enter toggles in/out of the context. Pinned rows float to the top. Esc closes the picker; the populated context survives.\n* ''`Topics for context`'' view — worked example of a context-aware view. Layer filter narrows to topics whose `stakeholders` field contains at least one pinned tiddler. Declares `ca-view-context-aware: yes` so the view pill paints an indigo badge when context is non-empty. Edit `$:/config/rimir/worga/topics-stakeholder-field` to match your data model.\n\n!! Prerequisites\n\n* TiddlyWiki ≥ 5.4.0\n* `rimir/cascade-palette` ≥ 0.0.98 — provides sticky-context, the `ca-view-after-fire: stay` view-level keep-open default (0.0.96), ambient `<<sticky-context-list>>` in every `_filterInScope` (0.0.97), and the view-history back-stack so Esc out of `m`-driven or take-call-driven views returns to where you were (0.0.98). Without 0.0.97, the ☑/☐ row icon in Pick attendees always shows ☐ regardless of pin state; without 0.0.98, Esc closes the palette instead of returning to the previous view.\n* `rimir/kind` is optional — when installed, verbs route via `kind.type`; otherwise they fall back to tag-based matching.\n\n!! Quick start\n\n# Install `rimir/cascade-palette` 0.0.98+ and this plugin. Restart.\n# Open the palette (Ctrl-Space). The Context pill strip is empty.\n# In any view, Space on a tiddler representing a person — pick ''Take call from this person'' (this plugin's verb). Sticky context is cleared, the person is pinned, AND the palette jumps to the ''Topics for context'' view. Press ''`Esc`'' to return to the view you were in when you fired the verb — the pinned person stays in context (only the view-jump unwinds).\n# Switch back to your usual view at any time (manually via view pills) — that clears the back-stack since you've taken over navigation. The Context strip still shows the pinned person until you clear it (Shift-C leader) or unpin (Backspace on the pill).\n# To start a multi-person meeting: type `m` (leader) → the ''Pick attendees'' view opens. Enter on each attendee — each toggles in/out of context, view stays open, ☑/☐ updates live, pinned rows float to top. ''`Esc`'' returns to the view you were in when you pressed `m` (the picked attendees stay in sticky context).\n# Type ''`C`'' (capital, leader) to clear sticky context.\n\n!! Adding your own context-aware views\n\nThe mechanism is in cp; this plugin is just patterns. To add your own view that narrows by sticky context:\n\n```\ntitle: $:/your/views/whatever\ntags: $:/tags/rimir/cascade-palette/view\nca-view-name: My narrowed view\nca-view-context-aware: yes\nca-view-roots: [all[tiddlers]has[<your-field>]] :filter[<currentTiddler>get[<your-field>]enlist-input[] :intersection[enlist<sticky-context-list>]]\n```\n\nThe badge appears when sticky context is non-empty AND `ca-view-context-aware: yes`. The narrowing happens in the filter — there's no engine-level auto-narrow.\n\n!! Adding your own toggle-multiselect\n\nFor a checkbox-style multiselect view (the pattern Pick attendees uses):\n\n```\ntitle: $:/your/views/multiselect\ntags: $:/tags/rimir/cascade-palette/view\nca-view-name: Pick X\nca-view-roots: [all[tiddlers]field:kind.type[YOUR-TYPE]!is[system]]\nca-view-sort: custom\nca-view-sort-key: [enlist<sticky-context-list>match<currentTiddler>then[0]else[1]addsuffix<currentTiddler>]\nca-view-row-icon: [enlist<sticky-context-list>match<currentTiddler>then[☑]else[☐]]\nca-view-after-fire: stay\nca-view-row-actions: <$action-sendmessage $message={{{ [enlist<sticky-context-list>match<currentTiddler>then[rimir-cascade-palette-unpin-context]else[rimir-cascade-palette-pin-context]] }}} title=<<currentTiddler>>/>\n```\n\nTwo patterns coordinate: the row-icon + sort-key give visual state; the inline-filter `$message` toggles per row. Enter on any row pins or unpins; the palette stays open between toggles thanks to `ca-view-after-fire: stay`.\n",
        "requires-reload": "no",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%234338ca%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%229%22%2F%3E%0A%3Cpolyline%20points%3D%2212%207%2012%2012%2015%2014%22%2F%3E%0A%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%221.2%22%20fill%3D%22%234338ca%22%20stroke%3D%22none%22%2F%3E%0A%3C%2Fsvg%3E%0A"

/*\
title: $:/plugins/tiddlywiki/pluginlibrary/libraryserver.js
type: application/javascript
module-type: library

A simple HTTP-over-window.postMessage implementation of a standard TiddlyWeb-compatible server. It uses real HTTP to load the individual tiddler JSON files.

\*/

"use strict";

// Listen for window messages
window.addEventListener("message",function listener(event){
	console.log("plugin library: Received message from",event.origin);
	console.log("plugin library: Message content",event.data);
	switch(event.data.verb) {
		case "GET":
			if(event.data.url === "recipes/library/tiddlers.json") {
				// Route for recipes/library/tiddlers.json
				event.source.postMessage({
					verb: "GET-RESPONSE",
					status: "200",
					cookies: event.data.cookies,
					url: event.data.url,
					type: "application/json",
					body: JSON.stringify(assetList,null,4)
				},"*");
			} else if(event.data.url.indexOf("recipes/library/tiddlers/") === 0) {
				var url = "recipes/library/tiddlers/" + encodeURIComponent(removePrefix(event.data.url,"recipes/library/tiddlers/"));
				// Route for recipes/library/tiddlers/<uri-encoded-tiddler-title>.json
				httpGet(url,function(err,responseText) {
					if(err) {
						event.source.postMessage({
							verb: "GET-RESPONSE",
							status: "404",
							cookies: event.data.cookies,
							url: event.data.url,
							type: "text/plain",
							body: "Not found"
						},"*");
					} else {
						event.source.postMessage({
							verb: "GET-RESPONSE",
							status: "200",
							cookies: event.data.cookies,
							url: event.data.url,
							type: "application/json",
							body: responseText
						},"*");
					}
				});
			} else {
				event.source.postMessage({
					verb: "GET-RESPONSE",
					status: "404",
					cookies: event.data.cookies,
					url: event.data.url,
					type: "text/plain",
					body: "Not found"
				},"*");
			}
			break;
	}
},false);

// Helper to remove string prefixes
function removePrefix(string,prefix) {
	if(string.indexOf(prefix) === 0) {
		return string.substr(prefix.length);
	} else {
		return string;
	}
}

// Helper for HTTP GET
function httpGet(url,callback) {
	var http = new XMLHttpRequest();
	http.open("GET",url,true);
	http.onreadystatechange = function() {
		if(http.readyState == 4 && http.status == 200) {
			callback(null,http.responseText);
		}
	};
	http.send();
}
