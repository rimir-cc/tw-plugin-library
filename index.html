        "type": "application/json",
        "readme": "! Appify\n\nTransform TiddlyWiki into an app platform. Define full-viewport applications with named layouts, statewrap-powered state channels, and a floating launcher to switch between apps and the default wiki.\n\n!! Features\n\n* ''App layouts'' — predefined grid templates (sidebar+main, topbar+sidebar+main, triple-column, dashboard, focus) with named view slots\n* ''Statewrap integration'' — each app defines its own state channels and reactive rules\n* ''View binding'' — each slot transcludes a tiddler that reads/writes channels by name\n* ''Floating app switcher'' — always-visible FAB button to launch apps or return to the default wiki\n* ''Edit mode modals'' — channel editor (add/rename/delete channels, set defaults), rule editor (add/delete reactive rules), debug inspector (live state, layout switcher)\n* ''In-app tiddler editor'' — edit view tiddlers with the full TW EditTemplate (toolbar, tags, fields, type) in a draft-based overlay, with save/cancel\n* ''Layout switching'' — switch layouts from the debug inspector; configs (view bindings, splits, proportions) are saved per layout and restored when switching back\n* ''Conditional panes'' — split panes can have filter-based conditions; hidden panes collapse and siblings expand to fill the space\n* ''Stacked views (tab groups)'' — a pane can hold multiple views with a tab bar; each view can have its own condition filter\n* ''Draggable grid borders'' — resize grid tracks and split panes by dragging; handles respect grid-area spans\n* ''Clone & delete'' — clone blueprint apps into your own namespace; clone individual views into your namespace; delete apps with full cleanup\n* ''LLM integration'' — in-app chat panel (requires llm-connect) with context-scoped help pages (via llm-help). Activating an app automatically sets `rimir/appify` as the active help context; leaving returns to default. Deny-list protection hides tiddlers tagged `sensitive` from the LLM. Ships a `wikitext_render_in_app` tool that renders wikitext inside the active app's `<$statewrap>` scope, so the LLM can preview views with `statewrap-get` resolved against current channel values. The in-app chat's system prompt auto-injects the active app's layout, channels (with effective values), and view bindings (including conditional splits) so the LLM knows what is currently on screen\n* ''Extensible'' — register apps by tagging tiddlers with `$:/tags/rimir/appify/app`; tag view tiddlers with `$:/tags/rimir/appify/view` for discovery\n\n!! Quick start\n\n# Install the plugin (requires statewrap)\n# Open the sample app from the FAB (bottom-right)\n# Enter edit mode (Ctrl+M) and click ''⧉ Clone'' to create your own copy\n# Customize the cloned app — edit views, add channels, change layouts\n\nThe plugin ships sample apps as read-only blueprints. They must be cloned into your own namespace before use. Cloned apps and views live at `$:/config/rimir/appify/apps/` and `$:/config/rimir/appify/views/` by default (configurable via clone prefix setting).\n\n!! App tiddler fields\n\n|!Field |!Description |\n|`appify-layout` |Layout template name (e.g., `topbar-sidebar-main`) |\n|`appify-channels` |Space-separated channel names for statewrap |\n|`appify-default-<name>` |Default value for channel `<name>` |\n|`appify-view-<slot>` |Tiddler title to transclude into layout slot `<slot>` |\n|`caption` |Display name in the app switcher |\n\nThe tiddler's text body contains `<$statewrap-rule>` definitions for reactive rules.\n\n!! Edit mode (Ctrl+M)\n\nIn edit mode, all conditional panes are shown (maximal layout) regardless of their condition filters. The debug bar shows live channel values and five buttons:\n\n* ''⚙ Channel editor'' — add, rename, delete channels and set default values\n* ''⇄ Rule editor'' — view and edit reactive rules (when channel X changes → set channel Y)\n* ''🔍 Debug inspector'' — app info, live state tiddler paths, layout switcher\n* ''⧉ Clone'' — create a copy of the app and its views in a configurable namespace\n* ''✕ Delete'' — permanently remove the app and all associated tiddlers\n\nEach slot shows a label bar with: ''✎'' edit (opens modal editor), ''⧉'' clone (copies view to your namespace), ''↔'' / ''↕'' split buttons, and ''✕'' delete (for sub-slots). Below the label bar: a view selector dropdown (lists all tiddlers tagged `$:/tags/rimir/appify/view`), an inline condition editor (for sub-slots), and a wikitext textarea.\n\nStacked views show as functional tabs — click a tab to see its editor. The label bar pencil opens the modal for the currently active tab.\n\n!! Built-in layouts\n\n|!Name |!Slots |!Description |\n|`sidebar-main` |sidebar, main |Left sidebar + main content |\n|`topbar-sidebar-main` |topbar, sidebar, main |Top bar + left sidebar + main content |\n|`triple-column` |left, center, right |Three equal columns |\n|`dashboard` |topbar, left, right |Top bar + two equal panels |\n|`focus` |main |Single full-viewport pane |\n\nLayout configs (view bindings, splits, proportions) are saved per layout and automatically restored when switching back.\n\n!! Prerequisites\n\n* TiddlyWiki 5.3.0 or later\n* statewrap plugin\n",

        "readme": "! Capture\n\nA generic inbox plugin for quick idea capture using streams. Throw in thoughts, ideas, and fleeting notes — then triage them into structured typed entities when ready.\n\n!! Features\n\n* **Inbox stream** — rapid keyboard-driven capture via the streams plugin\n* **Triage view** — review captures, promote to typed entities (task, meeting, etc.)\n* **Configurable** — set which stream tiddler serves as inbox\n* **Generic** — works with any typed model, not tied to a specific domain\n\n!! Prerequisites\n\n* [[Streams plugin|$:/plugins/sq/streams]] for stream-based note entry\n* [[Typed plugin|$:/plugins/rimir/typed]] for promoting captures to structured entities\n\n!! Quick start\n\n# Open the inbox view and start typing — entries are saved as stream nodes\n# When ready to triage, switch to the triage view\n# Click \"Promote\" on a capture to open the typed spawner with text pre-filled\n",

        "source": "https://github.com/rimir-cc/tw-cascade-palette",

        "type": "application/json",
        "readme": "! What it does\n\nA keyboard-driven cascading command palette for TiddlyWiki. Hit one hotkey (default: ''Ctrl-Space'') to open. Type to filter a stage. ''→'' (Right-arrow) drills into a stage. ''Space'' opens the action menu on typed rows (works on containers too). ''Esc'' walks one stage back, ''Shift-Esc'' closes from any depth. ''Enter'' fires the selected action. Domain plugins (e.g. `rimir/orga-palette`) extend the palette by shipping declarative ''entry'' and ''action'' tiddlers — no widget code required.\n\n! Key features\n\n* ''Cascading stages'' — every drill pushes a new stage; ArrowLeft / Esc pops one stage at any depth, Shift-Esc closes from any depth. Breadcrumb shows where you are.\n* ''Declarative protocol'' — adding a new cascade is one tiddler. Tag, fields, done.\n* ''Generic engine'' — no domain knowledge baked in. Same widget serves any catalogue plugin.\n* ''Multi-view root menu'' — switch between ''Entries'' / ''All tiddlers'' / ''By namespace'' / ''By parent'' / ''Hybrid'' / ''By date'' views from a pill strip above the input. Each view is a composition of one or more ''channels'' (`ca-view-channels` lists them) — each channel declaring its own `roots` + `children` filters, row decorations, and optional `row-entity-type` for context-action drilling. A focusable ''Structure'' strip below the view pills makes the active view's composition externally visible: compact by default (one summary row with view name + channel-count + view-scoped pills), expandable on Enter/Space/→ to a full stacked layout (view-scoped header + one mini-row per channel with all primitive pills). Arrow keys navigate the expanded grid; each focused pill renders contextual help into the details drawer. Entries can opt into per-view placement via `ca-position-<view-slug>` fields. Add your own views as tiddlers tagged `$:/tags/rimir/cascade-palette/view` and your own channels as tiddlers tagged `$:/tags/rimir/cascade-palette/channel`.\n* ''Grouping axes'' — any channel can declare a chain of ''axes'' that bucket the channel's source set at the top of the descent: year → month → day, status → year, prefix → tag, anything you can write as a one-filter derive-key. Axes ''compose with'' the channel's recursive `children` filter — so the same channel can be pure grouping (axes only), today's recursive tree (children only), or both (bucket the forest roots, then descend each). Edit chains live from the Structure strip: yellow ''by'' / ''→'' pills in each channel's mini-row, ''+'' pill to append, Backspace to remove, Shift-←/→ to reorder, Enter to swap. Ship axes as tiddlers tagged `$:/tags/rimir/cascade-palette/axis` — `ca-axis-key` is a one-line filter mapping rows to bucket keys.\n* ''Leader keys'' — type a single char and idle for 200ms to fire a shortcut: `x` clears all filter+visibility pills, `>` opens a tree-picker that commits a path as a title-prefix filter, `s` saves the current state as a named preset, `r` jumps focus to the preset strip. Every visible leader is also surfaced as a pill in the ''Leader'' strip above the input, so the available gestures are discoverable without prior knowledge — Tab into the strip, ←/→ to select, ↵/Space to fire. Leaders may be view-scoped via ''`ca-leader-views`'' (a filter producing view titles) — empty / missing means global. Author your own as tiddlers tagged `$:/tags/rimir/cascade-palette/leader`.\n* ''Presets'' — save any combination of active view + filter pills + visibility pills under a name; replay later by picking the preset's pill. Tiddlers tagged `$:/tags/rimir/cascade-palette/preset`.\n* ''Filter strip'' — type `/foo`, `prefix:work/`, `#tag`, `@<tiddler>` to stack ''filter'' pills that narrow every result list. Tiddlers tagged `$:/tags/rimir/cascade-palette/filter`.\n* ''Visibility strip'' — type `hide:appify` to hide entries by group, or Shift-DEL on a root row to hide a single entry. Tiddlers tagged `$:/tags/rimir/cascade-palette/visibility`. Ctrl-DEL clears both filter and visibility strips.\n* ''Filter substitution'' — `<<query>>`, `<<picked>>`, `<<parent-picked>>`, `<<context-tiddler>>` available in every filter and action. Filter/visibility expressions also see `<arg>` and `<<arg>>`. Inside a preview-bearing subtree, `<<stage-preview-context>>` exposes the entity the side preview is pinned to.\n* ''Sticky context'' — pin one or more tiddlers (Space → ''Pin to context'', or type ''`+<title>`'' + Enter for a one-handed pin) and they appear as the ''Context'' pill strip + the `<<sticky-context-list>>` / `<<sticky-context-count>>` variables exposed to every filter/action scope. ''Page-session only'' — reload clears it (capture as a preset if you need cross-reload memory). Views opt in to narrowing by referencing the variable in their channel filters AND declaring ''`ca-view-context-aware: yes`'' to paint a small badge when context is non-empty. Generic verbs (Pin / Unpin / Clear) ship here; workflow-specific verbs (call, meeting, focus) belong in a sibling plugin like ''`rimir/worga`''.\n* ''Row icons'' — small glyphs in a footer strip below tiddler-bearing rows, surfacing affordances on the row's backing tiddler. Shipped: a ''🌐'' glyph appears on any tiddler whose configured URL field(s) carry an http/https/ftp/mailto/tel value (default field: ''`url`'' — configurable via ''`$:/config/rimir/cascade-palette/url-fields`''). ''Alt-↵'' on a row with at least one icon (or clicking the glyph directly) fires the primary icon's action — for ''🌐'' that opens the URL in a new browser tab; ''Ctrl-Alt-↵'' fires the icon's secondary action — for ''🌐'' that copies the URL to the clipboard. Author your own via tiddlers tagged ''`$:/tags/rimir/cascade-palette/row-icon`''.\n* ''Actionable-row indicator'' — every row whose tiddler has at least one applicable action (via catalogue / configured-field bridge / `ca-applies` filter) gets a thin indigo bar at its leading edge (`rcp-row-actionable` class) AND a right-edge ''`→N`'' badge counting the available actions. Lets you scan ↑/↓ down a long list and see where Space will actually open something — no speculative keystrokes. Three discovery paths unioned: ''catalogue'' (action `ca-entity-type` matches the row's bound type — set by `ca-channel-row-entity-type` on the emitting channel); ''configured-field bridge'' (when an installed plugin sets `$:/config/rimir/cascade-palette/entity-type-field` to a field name, e.g. `kind` ships it as `kind.type` — action `ca-entity-type: <X>` then auto-matches any row whose tiddler has `<configured-field>: <X>`); ''filter'' (action declares `ca-applies` — filter evaluated with `<currentTiddler>` = row title, non-empty result = applies). All three further narrowed by per-action `ca-action-when`. Per-view opt-out via `ca-view-show-action-preview: no`.\n* ''Lenses (row decorations)'' — a ''lens'' projects one or more decoration slots onto every data row: ''name'' (replace the displayed name), ''icon'' (a leading glyph), or ''annotation'' (a trailing badge). Each slot is its own single-select chooser strip below the view strip; pick a lens, ''(off)'' to disable, or ''➕ New…'' to author one in-palette (type its projection filter with a live match-count; rows decorate as you type). Ships with three ''name'' lenses — ''Title'', ''Caption'', and ''Caption → Title'' (default: captioned tiddlers caption-first, everything else by title) — generic ''Modified'' (filter) and ''Tags'' (template) ''annotation'' lenses, and, with `rimir/kind`, a ''Kind'' ''icon'' lens showing each instance's `kind.icon`. A lens slot is a filter (cheap) or a `ca-lens-<slot>-template` (rich wikitext) evaluated per row with `<currentTiddler>`, so a row reads consistently regardless of which view surfaced it; a lens can also contribute always-on ''actions'' (`ca-lens-actions`) — the Kind lens owns the kind Open / Edit / Delete actions, available even with the icon slot off. Author / edit / delete in-palette: the ''Manage lenses'' entry lists every lens — drill a lens for a per-facet editor (name, when, default slots, each slot's filter + template, actions, delete; templates and actions editable here, no hand-authoring) — plus a ''+ New…'' creator per slot; or use the per-slot ''➕ New…'' pill / ''e'' to edit / ''DEL'' to delete; or tag a tiddler `$:/tags/rimir/cascade-palette/lens` with a `ca-lens-<slot>-filter`. Picks persist across reload (`$:/state/rimir/cascade-palette/lens/<slot>`). Static palette entries / actions keep their explicit `ca-name`; only data rows are decorated.\n* ''Side preview pane'' — right-column pane that opens when the user drills into a row whose menu declared a preview (or whose context matches a tagged auto-attach candidate). Two registration mechanisms work in parallel: ''per-menu'' — an entry/action sets ''`ca-preview-template`'' (+ optional ''`ca-preview-context`'' filter / ''`ca-preview-title`'' caption / ''`ca-preview-name`'' pill label), explicit and pinned at drill-time; ''tag-based'' — any tiddler tagged ''`$:/tags/rimir/cascade-palette/side-preview`'' is a candidate whose ''`ca-preview-applies`'' filter is evaluated against the active context, auto-attaching whenever it matches (no per-menu wiring needed). When two or more candidates apply at the same context, a pill row appears at the top of the pane — ←/→ when the pane has focus cycles between them (also click). The cascade visually shrinks to 50% on the left; the pane stays mounted while the registering stage (or any deeper one) is on the stack, then disappears when the user pops past. Use it to live-render a form for the kind being edited, a chart of the data being filtered, etc. Distinct from the ''detail'' drawer (the Ctrl-hold / always-on row below the menu), which is bound to the selected row.\n* ''Keyboard-first'' — Up/Down to select, Tab to cycle sections (input → preset → visibility → filter → view → structure → leader → menu → detail → preview), Shift-Tab to jump between the pill-group and the main group, Esc to walk one stage back (closes only at root from input), Shift-Esc to close from any depth, Enter to fire. ''→'' drills (descend tree containers / open the action menu on typed catalogue leaves); ''Space'' opens the action menu on ''any'' tiddler row whose actions match via `ca-applies` — works in tree views (By namespace, By parent, Hybrid), not only in the catalogue. Left/Right inside the input preserve normal cursor behaviour. ''Type-ahead'' — start typing a printable character from any section and focus jumps back to the input with the character appended, so you never have to Tab back just to keep filtering.\n\n! Prerequisites\n\n* TiddlyWiki ≥ 5.4.0\n\n! Quick start\n\nInstall the plugin, restart. Ctrl-Space opens the palette. Out of the box you get four demo entries (Open Control Panel, Save Wiki, Advanced Search, Recent Tiddlers…) so you can confirm it's working. The real value is in shipping your own ''entry'' and ''action'' tiddlers — see the [[Documentation]] tab for the protocol.\n\nTo rebind, edit the tiddler `$:/config/shortcuts/rimir-cascade-palette-open`.\n\n! Extending: the action-tiddler protocol\n\n* ''Entry tiddlers'' — root-stage menu items. Tagged `$:/tags/rimir/cascade-palette/entry`.\n* ''Action tiddlers'' — what appears in the action menu for a picked entity. Tagged `$:/tags/rimir/cascade-palette/action`, scoped via `ca-entity-type` field.\n\nEach tiddler declares whether it's a ''leaf'' (fires actions on Enter and closes) or a ''drill'' (pushes a new stage). Cascades form an implicit graph: a drill from type A → type B is just a tiddler with `ca-entity-type: A` and `ca-next-entity-type: B`. Add a new edge by writing one tiddler.\n\nSee the Documentation tab's ''Protocol'' section for full schema and worked examples.\n",
        "requires-reload": "yes",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%233a7%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%3Crect%20x%3D%222%22%20y%3D%223%22%20width%3D%2210%22%20height%3D%226%22%20rx%3D%221%22%2F%3E%0A%3Cpolyline%20points%3D%2213%2C6%2017%2C6%2017%2C12%2021%2C12%22%2F%3E%0A%3Crect%20x%3D%2211%22%20y%3D%229%22%20width%3D%2210%22%20height%3D%226%22%20rx%3D%221%22%2F%3E%0A%3Cpolyline%20points%3D%2213%2C18%2017%2C18%2017%2C21%22%2F%3E%0A%3Crect%20x%3D%2214%22%20y%3D%2215%22%20width%3D%227%22%20height%3D%226%22%20rx%3D%221%22%2F%3E%0A%3C%2Fsvg%3E%0A"

        "type": "application/json",
        "readme": "! components\n\nReusable UI component framework with composable mixins and facade components. Build complex interactive widgets by combining small, focused building blocks.\n\n!! Key features\n\n* ''Facade components'' — ready-to-use `pills` (with inline/popup filtering) and `vtabs` components\n* ''Mixin system'' — composable behaviours: state handling, single/multi select, delegation\n* ''Style-by-type'' — swappable visual styles (e.g., `simple-hoverable-pill`, `tabs-style`)\n* ''Menu component'' — configurable menu with delegate-based actions\n* ''Showcase'' — live interactive examples demonstrating all components\n\n!! Prerequisites\n\nNo external prerequisites.\n\n!! Quick start\n\nUse facade components directly via transclusion. See the showcase tiddler (`$:/plugins/rimir/components/showcase`) for interactive examples of all available components and mixins.\n",

    {
        "title": "$:/plugins/rimir/cytoscape-engine",
        "description": "Cytoscape.js graph engine adapter for tw-graph with compound node support",
        "name": "cytoscape engine",
        "author": "rimir",
        "version": "0.1.11",
        "core-version": ">=5.3.0",
        "plugin-type": "plugin",
        "dependents": "",
        "soft-dependents": "$:/plugins/rimir/doc-template",
        "list": "readme documentation settings changelog license",
        "type": "application/json",
        "readme": "! Cytoscape Engine\n\nAn alternative graph rendering engine for [[tw-graph|$:/plugins/flibbles/graph]] powered by [[Cytoscape.js|https://js.cytoscape.org/]] (v3.33.2).\n\n!! Key Features\n\n* ''Drop-in replacement'' for vis-network — existing `<$graph>` markup works unchanged\n* ''Interactive clusters'' — drag nodes onto each other to group, double-click to rename/color, drag away to remove\n* ''Per-graph cluster config'' — each graph stores clusters in its own config tiddler\n* ''Nested clusters'' — clusters inside clusters\n* ''COSE layout'' — Compound Spring Embedder that handles nested groups natively\n* Full event support: hover, click, drag, double-click\n* Position persistence and physics simulation\n* ''Auto-fit to view'' — frames all nodes on load and when the container resizes (via a `ResizeObserver`), and re-frames when the visible node set changes; dragging a node leaves the viewport untouched. The canvas stays hidden until its first framed fit, so it never flashes un-framed on mount (matters when the container's height resolves a frame after init, e.g. a side-preview pane)\n\n!! Quick Start\n\n# Install this plugin alongside `flibbles/graph`\n# Go to ''Settings > Graph Engine'' and select ''Cytoscape''\n# All existing graphs render with Cytoscape.js\n\n!! Interactive Clusters\n\nEnable with `clusterData` graph property pointing to a config tiddler:\n\n```\n<$graph>\n<$properties $for=\"graph\" clusterData=\"$:/config/my-clusters\">\n  <$node $tiddler=\"Alice\" label=\"Alice\"/>\n  <$node $tiddler=\"Bob\" label=\"Bob\"/>\n</$properties>\n</$graph>\n```\n\n|!Gesture |!Effect |\n|Drag node onto node |Creates cluster containing both |\n|Drag node onto cluster |Adds to cluster |\n|Drag 200+ px from grab point |Removes from cluster |\n|Double-click cluster label |Rename + color picker |\n\n!! Prerequisites\n\n* `$:/plugins/flibbles/graph` (tw-graph) v1.6.0+\n* TiddlyWiki 5.3.0+\n",
        "requires-reload": "yes",
        "icon": "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%20width%3D%2248%22%20height%3D%2248%22%3E%0A%20%20%3Ccircle%20cx%3D%2264%22%20cy%3D%2264%22%20r%3D%2258%22%20fill%3D%22none%22%20stroke%3D%22%232B7CE9%22%20stroke-width%3D%224%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2240%22%20cy%3D%2245%22%20r%3D%2210%22%20fill%3D%22%23D2E5FF%22%20stroke%3D%22%232B7CE9%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2290%22%20cy%3D%2235%22%20r%3D%2210%22%20fill%3D%22%23D2E5FF%22%20stroke%3D%22%232B7CE9%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2275%22%20cy%3D%2285%22%20r%3D%2210%22%20fill%3D%22%23D2E5FF%22%20stroke%3D%22%232B7CE9%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2235%22%20cy%3D%2290%22%20r%3D%228%22%20fill%3D%22%23D2E5FF%22%20stroke%3D%22%232B7CE9%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Cline%20x1%3D%2248%22%20y1%3D%2248%22%20x2%3D%2282%22%20y2%3D%2238%22%20stroke%3D%22%23848484%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Cline%20x1%3D%2244%22%20y1%3D%2253%22%20x2%3D%2270%22%20y2%3D%2279%22%20stroke%3D%22%23848484%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Cline%20x1%3D%2286%22%20y1%3D%2244%22%20x2%3D%2278%22%20y2%3D%2276%22%20stroke%3D%22%23848484%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Cline%20x1%3D%2238%22%20y1%3D%2283%22%20x2%3D%2269%22%20y2%3D%2288%22%20stroke%3D%22%23848484%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Crect%20x%3D%2255%22%20y%3D%2220%22%20rx%3D%224%22%20ry%3D%224%22%20width%3D%2235%22%20height%3D%2275%22%20fill%3D%22none%22%20stroke%3D%22%232B7CE9%22%20stroke-width%3D%222%22%20stroke-dasharray%3D%224%2C3%22%20opacity%3D%220.5%22%2F%3E%0A%3C%2Fsvg%3E%0A"

    {
        "title": "$:/plugins/rimir/diffsync",
        "description": "Field-level tiddler comparison with selective sync",
        "name": "diffsync",
        "author": "rimir",
        "version": "0.1.7",
        "core-version": ">=5.4.0",
        "source": "https://github.com/rimir-cc/tw-diffsync",
        "plugin-type": "plugin",
        "list": "readme documentation settings panel review changelog license",
        "dependents": "$:/plugins/rimir/theme",
        "soft-dependents": "$:/plugins/rimir/doc-template",
        "type": "application/json",
        "readme": "! diffsync -- field-level tiddler comparison with selective sync\n\nCompare two tiddlers field by field. Single-line fields show source vs target values. Multiline fields (like `text`) are broken into line-based hunks with surrounding context, so you can see exactly what changed. Toggle individual hunks or fields to pick which version to keep, then apply in either direction.\n\n!! Key features\n\n* ''Field-level comparison'' -- every field is compared independently, skipping `title`\n* ''Line-based hunks'' -- multiline fields use diff-match-patch to produce line-level diffs grouped into hunks with configurable context lines\n* ''Per-hunk selective sync'' -- toggle each hunk between source and target before applying\n* ''Bidirectional apply'' -- apply selected changes to the target tiddler or back to the source\n* ''Review mode'' -- accept or skip individual changes; starts with all changes skipped so you selectively accept what you want\n* ''Auto-refresh'' -- diff view updates live when source or target tiddler is modified\n* ''Swap and re-compare'' -- swap source/target with one click, auto-re-compares if a result exists\n* ''Clean state management'' -- all UI state lives in `$:/state/diffsync/*` and `$:/temp/diffsync/*`, cleared on new comparisons\n\n!! Quick start\n\n# Open the diffsync panel (plugin tab or drag `$:/plugins/rimir/diffsync/panel` into your story)\n# Select a source and target tiddler from the dropdowns\n# Click ''Compare'' to see field-by-field differences\n# For single-line fields, toggle between source and target values\n# For multiline fields, toggle individual hunks\n# Click ''Apply to target'' or ''Apply to source'' to write the selected changes\n\n!! Prerequisites\n\n* TiddlyWiki 5.3.0+\n* Theme plugin (`$:/plugins/rimir/theme`) for `rr-` utility classes\n",
        "requires-reload": "yes",
        "icon": "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2222pt%22%20height%3D%2222pt%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22maroon%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%2217%201%2021%205%2017%209%22%2F%3E%3Cpath%20d%3D%22M3%2011V9a4%204%200%200%201%204-4h14%22%2F%3E%3Cpolyline%20points%3D%227%2023%203%2019%207%2015%22%2F%3E%3Cpath%20d%3D%22M21%2013v2a4%204%200%200%201-4%204H3%22%2F%3E%3C%2Fsvg%3E%0A"
    },
    {
        "title": "$:/plugins/rimir/doc-template",
        "name": "doc template",
        "description": "Branded documentation system for rimir plugins",
        "version": "0.1.4",
        "author": "rimir",
        "source": "https://github.com/rimir-cc/tw-doc-template",
        "plugin-type": "plugin",
        "list": "readme documentation settings hub changelog license",
        "dependents": "$:/plugins/rimir/theme",
        "type": "application/json",
        "readme": "! doc template\n\nBranded documentation system for all rimir plugins. Renders plugin documentation with a consistent layout featuring a dark header, tab navigation, breadcrumbs, and an auto-discovery hub that lists all documented plugins.\n\n!! Key features\n\n* ''Auto-discovery hub'' — card grid grouped by category, finds all documented plugins automatically\n* ''Branded page layout'' — header, breadcrumb, tabs, and footer for consistent presentation\n* ''Field-based discovery'' — no tags needed, uses `rdt.*` fields for metadata\n* ''Callout boxes'' — four types: info, warning, tip, danger\n* ''In-place navigation'' — seamless browsing when accessed from the hub\n* ''Related plugins footer'' — links to related plugins at the bottom of each page\n\n!! Prerequisites\n\n* theme plugin (for CSS classes)\n\n!! Quick start\n\nCreate `doc-overview.tid` in your plugin with `rdt.plugin-key`, `rdt.section`, `rdt.plugin-name`, `rdt.plugin-subtitle`, `rdt.hub-category` fields. The version is read automatically from `plugin.info`. Transclude `$:/plugins/rimir/doc-template/templates/page` and fill the `body` slot. The hub auto-discovers it.\n",
        "requires-reload": "no",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22maroon%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%3Cpath%20d%3D%22M14%202H6a2%202%200%200%200-2%202v16a2%202%200%200%200%202%202h12a2%202%200%200%200%202-2V8z%22%2F%3E%0A%3Cpolyline%20points%3D%2214%202%2014%208%2020%208%22%2F%3E%0A%3Cline%20x1%3D%228%22%20y1%3D%2213%22%20x2%3D%2216%22%20y2%3D%2213%22%2F%3E%0A%3Cline%20x1%3D%228%22%20y1%3D%2217%22%20x2%3D%2213%22%20y2%3D%2217%22%2F%3E%0A%3C%2Fsvg%3E"

    {
        "title": "$:/plugins/rimir/explide",
        "description": "Interactive testcase composition IDE",
        "author": "rimir",
        "version": "0.1.7",
        "core-version": ">=5.3.0",
        "source": "https://github.com/rimir-cc/tw-explide",
        "name": "explide",
        "plugin-type": "plugin",
        "dependents": "$:/plugins/rimir/theme $:/plugins/rimir/components $:/plugins/kookma/shiraz",
        "soft-dependents": "$:/plugins/rimir/doc-template",
        "list": "readme documentation settings examples changelog license",
        "type": "application/json",
        "readme": "! explide\n\nInteractive testcase composition IDE for TiddlyWiki. Create config tiddlers that assemble plugins, shadow tiddlers, and ad-hoc content into isolated `$testcase` sandboxes — all from within the wiki.\n\n!! Key features\n\n* ''Config-driven'' — each config tiddler (`rri.type: explide/config`) defines a complete testcase sandbox\n* ''Plugin import'' — import entire plugins or individual shadow tiddlers, with bulk import from filter\n* ''Explide data'' — override imported shadow tiddlers with editable copies using `$rri$:` field remapping\n* ''Field editor'' — add, edit, and delete `$rri$:` remapped fields via the FIELDS tab\n* ''Ad-hoc tiddlers'' — create text-only tiddlers inline without separate files\n* ''Snapshot & diff'' — take snapshots of explide data, compare changes, and restore previous states\n* ''Diagnostics'' — detect missing plugins, unused imports, and stale snapshots\n* ''Layout toggle'' — switch between stacked and side-by-side view\n* ''Output tiddler'' — configurable which tiddler the testcase Output tab displays (defaults to `Output`)\n* ''ViewTemplate integration'' — config tiddlers automatically render the IDE when viewed\n\n!! Prerequisites\n\n* [[$:/plugins/rimir/theme]] — CSS utility classes (`rr-*`)\n* [[$:/plugins/rimir/components]] — tabs and UI components\n* [[$:/plugins/kookma/shiraz]] — slider macro and UI utilities\n\n!! Quick start\n\n# Create a new tiddler\n# Set the field `rri.type` to `explide/config`\n# Save — the IDE appears automatically in the tiddler view\n# Use the CONFIG tab to import plugins and select shadow tiddlers\n# Create an ad-hoc tiddler named `Output` in the ADHOC tab — this is what the testcase renders\n# Click on explide data tabs to edit overridden tiddlers in EDITOR, manage fields in FIELDS, or compare in DIFF\n\n!! Bundled examples\n\n* `$:/plugins/rimir/explide/examples/callout-sandbox` — theme callout types\n* `$:/plugins/rimir/explide/examples/mini-app` — counter app with state management\n* `$:/plugins/rimir/explide/examples/component-lab` — pills facade components\n",
        "requires-reload": "no",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22maroon%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%3Crect%20x%3D%223%22%20y%3D%223%22%20width%3D%2218%22%20height%3D%2218%22%20rx%3D%222%22%2F%3E%0A%3Cline%20x1%3D%223%22%20y1%3D%229%22%20x2%3D%2221%22%20y2%3D%229%22%2F%3E%0A%3Cline%20x1%3D%229%22%20y1%3D%229%22%20x2%3D%229%22%20y2%3D%2221%22%2F%3E%0A%3Ccircle%20cx%3D%226%22%20cy%3D%226%22%20r%3D%221%22%20fill%3D%22maroon%22%20stroke%3D%22none%22%2F%3E%0A%3Ccircle%20cx%3D%229%22%20cy%3D%226%22%20r%3D%221%22%20fill%3D%22maroon%22%20stroke%3D%22none%22%2F%3E%0A%3C%2Fsvg%3E%0A"

    {
        "title": "$:/plugins/rimir/ext-connect",
        "description": "HTTP endpoint for external tools — inbound (push tiddlers) and outbound (text-command extraction)",
        "name": "ext connect",
        "author": "rimir",
        "version": "0.1.9",
        "core-version": ">=5.3.0",
        "source": "https://github.com/rimir-cc/tw-ext-connect",
        "plugin-type": "plugin",
        "list": "readme documentation settings changelog license",
        "dependents": "$:/plugins/rimir/theme",
        "soft-dependents": "$:/plugins/rimir/doc-template",
        "type": "application/json",
        "readme": "! ext connect\n\nPush tiddlers into the wiki from external tools via CLI import — no running server needed. A shared resolution pipeline with profile-based templates, context-aware rules, and post-creation actions transforms raw input into fully-formed tiddlers.\n\n!! Key features\n\n* ''CLI import'' — primary inbound path via `--import` deserializer, no server required\n* ''Context resolution'' — templates reference context tiddlers for smart field population and rule matching\n* ''Profile-based templates'' — map profiles to template tiddlers with filter-based field resolution\n* ''Rule-based dispatch'' — ordered rules use TW filters to match context and select templates\n* ''Post-creation actions'' — template `text` field runs action widgets server-side after tiddler creation\n* ''Text-command extraction'' — outbound processing of tiddler content for external tool integration\n\n!! Prerequisites\n\n* Set `TIDDLYWIKI_CLI_MODE=1` environment variable for CLI import\n\n!! Quick start\n\nPush a tiddler via CLI:\n\n```\nTIDDLYWIKI_CLI_MODE=1 npx tiddlywiki mywiki --import input.json application/x-rimir-ext-connect\n```\n\nWhere `input.json` contains: `{\"text\": \"Hello\", \"title\": \"MyTiddler\"}`\n\n''Fallback: POST API'' (may be deprecated) — if a server is running, you can also use `POST /api/ext-connect/put-tiddler` with `X-Requested-With: TiddlyWiki` header. See the reference docs for details.\n",
        "requires-reload": "yes",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22maroon%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%3Cpath%20d%3D%22M15%207h3a5%205%200%200%201%200%2010h-3%22%2F%3E%0A%3Cpath%20d%3D%22M9%2017H6a5%205%200%200%201%200-10h3%22%2F%3E%0A%3Cline%20x1%3D%228%22%20y1%3D%2212%22%20x2%3D%2216%22%20y2%3D%2212%22%2F%3E%0A%3C%2Fsvg%3E%0A"

        "readme": "! External LLM Help\n\nllm-help pages for third-party TiddlyWiki plugins. This plugin contributes a `plugins/<plugin-slug>/...` subtree to the [[llm-help|$:/plugins/rimir/llm-help]] browser so an LLM working in a tiddler can discover and read context-aware documentation for the wiki's installed plugins.\n\n!! Why a separate plugin?\n\n* Third-party plugins (`flibbles/graph`, `evidentlyCube/AutoComplete`, ...) cannot be modified to ship their own llm-help pages.\n* Centralising their documentation here keeps it versioned, distributable, and discoverable through the same `llm_help` MCP tool the user already trusts.\n* Each documented plugin gets its own subfolder under `pages/` so adding a new one is a self-contained change.\n\n!! Layout\n\n```\npages/\n  plugins.tid                    -- root listing of documented plugins\n  tw5-graph/\n    root.tid                     -- llm-help-path: plugins/tw5-graph\n    overview.tid                 -- plugins/tw5-graph/overview\n    concepts.tid\n    concepts/<thing>.tid\n    widgets.tid\n    widgets/<widget>.tid\n    filters.tid\n    templates.tid\n    recipes.tid\n    recipes/<task>.tid\n    gotchas.tid\n  <next-plugin>/\n    ...\n```\n\nEvery page is tagged `$:/tags/rimir/llm-help/page` and gated by `llm-help-context: plugins/<plugin-slug>` so the entire subtree is opt-in.\n\n!! For maintainers\n\nUse the project skill ``/tw-derive-llmhelp-from-plugin <plugin-id>`` to generate or refresh a plugin's page tree. The skill reads TiddlyWiki gotcha memories first, analyses the plugin source, proposes a tree, and writes the pages.\n\n!! Requirements\n\n* [[$:/plugins/rimir/llm-help]] -- the help browser and `llm_help` tool.\n",
        "requires-reload": "no",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22maroon%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%3Crect%20x%3D%223%22%20y%3D%223%22%20width%3D%227%22%20height%3D%227%22%20rx%3D%221%22%2F%3E%0A%3Crect%20x%3D%2214%22%20y%3D%223%22%20width%3D%227%22%20height%3D%227%22%20rx%3D%221%22%2F%3E%0A%3Crect%20x%3D%223%22%20y%3D%2214%22%20width%3D%227%22%20height%3D%227%22%20rx%3D%221%22%2F%3E%0A%3Cpath%20d%3D%22M14%2017h7M17.5%2014v6%22%2F%3E%0A%3C%2Fsvg%3E%0A"

    {
        "title": "$:/plugins/rimir/file-pipeline",
        "description": "Configurable binary data processing pipelines — thumbnails, text extraction, format conversion, and LLM analysis",
        "name": "file pipeline",
        "author": "rimir",
        "version": "0.1.11",
        "core-version": ">=5.3.0",
        "source": "https://github.com/rimir-cc/tw-file-pipeline",
        "plugin-type": "plugin",
        "list": "readme documentation settings changelog license",
        "dependents": "$:/plugins/rimir/theme",
        "soft-dependents": "$:/plugins/rimir/doc-template $:/plugins/rimir/runner $:/plugins/rimir/file-upload $:/plugins/rimir/llm-connect",
        "type": "application/json",
        "readme": "! File Pipeline\n\nConfigurable binary data processing pipelines for TiddlyWiki. Define multi-step workflows that transform uploaded files into thumbnails, extracted text, format conversions, and LLM-generated analysis — all linked to the source file with automatic lifecycle management.\n\n!! Key Features\n\n* ''Configurable pipelines'' — define processing steps per file type as tiddlers (no restart needed)\n* ''Command steps'' — run shell commands (ImageMagick, pdftotext, pandoc, pdfimages, custom scripts)\n* ''LLM steps'' — send extracted text to an LLM for summarization, annotation, or analysis\n* ''Step chaining'' — output of one step feeds into the next (e.g., DOCX → PDF → thumbnail)\n* ''Artifact lifecycle'' — all generated tiddlers are linked via `_artifact_source` for automatic cascade delete/rename\n* ''Auto-matching'' — pipelines auto-select based on MIME type, or can be explicitly chosen\n* ''Interactive mode'' — LLM steps can pause for human review before creating artifacts\n\n!! Default Pipelines\n\n|!Pipeline |!File Types |!Steps |\n|pdf |PDF |Thumbnail + text extraction + image extraction |\n|docx |DOCX |Convert to PDF + thumbnail + text extraction |\n|image |JPEG, PNG, GIF, WebP |Thumbnail |\n|xlsx |XLSX |Text extraction |\n\n!! Prerequisites\n\n* ''runner'' plugin — provides `runner-actions.json` command execution\n* ''file-upload'' plugin — provides URI resolution and artifact cascade\n* ''llm-connect'' plugin — required only for LLM pipeline steps\n* External tools: `magick` (thumbnails), `pdftotext` (PDF text), `pandoc` (DOCX/markdown), `pdfimages` (PDF images), `libreoffice` (DOC→DOCX, DOCX→PDF)\n\n!! LLM Step Configuration\n\nLLM steps can be configured at three levels (highest priority first):\n\n# ''Step level'' — `systemPrompt`, `provider`, `model` fields in the pipeline step JSON\n# ''Dropzone level'' — `prop-system-prompt`, `prop-provider`, `prop-model` attributes on `<$file-dropzone>`\n# ''Global default'' — llm-connect's provider/model/system-prompt settings\n\n```\n<$file-dropzone pipeline=\"docx-llm\"\n  prop-system-prompt=\"$:/my/custom-system-prompt\"\n  prop-model=\"gpt-4o\">\n```\n\nStep-level fields support `{{config:$:/config/...}}` indirection to reference config tiddlers.",
        "requires-reload": "yes",
        "icon": "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2022%2022%22%20width%3D%2222pt%22%20height%3D%2222pt%22%3E%3Cpath%20d%3D%22M3%204a1%201%200%200%201%201-1h5l2%202h7a1%201%200%200%201%201%201v2H3V4z%22%20fill%3D%22%23800020%22%20opacity%3D%220.6%22%2F%3E%3Cpath%20d%3D%22M3%208h16v9a1%201%200%200%201-1%201H4a1%201%200%200%201-1-1V8z%22%20fill%3D%22none%22%20stroke%3D%22%23800020%22%20stroke-width%3D%221.2%22%2F%3E%3Cpath%20d%3D%22M7%2011l2%202%204-4%22%20fill%3D%22none%22%20stroke%3D%22%23800020%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E"

    {
        "title": "$:/plugins/rimir/file-upload",
        "description": "Upload files to configurable locations with rename, delete, thumbnails, artifact cascade, and deduplication",
        "name": "file upload",
        "author": "rimir",
        "version": "0.1.30",
        "core-version": ">=5.3.0",
        "source": "https://github.com/rimir-cc/tw-file-upload",
        "plugin-type": "plugin",
        "list": "readme documentation settings test changelog license",
        "dependents": "$:/plugins/rimir/theme",
        "soft-dependents": "$:/plugins/rimir/doc-template $:/plugins/rimir/file-pipeline",
        "type": "application/json",
        "readme": "! file upload\n\nUpload media files to configurable storage locations with automatic tiddler creation, rename, delete, thumbnail generation, artifact lifecycle management, and content-hash deduplication.\n\n!! Key features\n\n* ''Multi-location support'' — upload files to any registered writable location, not just `/files/`. Create and manage locations via the settings UI.\n* ''Location registry'' — tag-based tiddler convention (`$:/tags/rimir/file-upload/location`) for defining file storage locations with URI prefix, base path, and writable flag\n* ''Drag-and-drop upload'' — `<$file-dropzone>` widget with `location` attribute to target any writable location\n* ''Thumbnail generation'' — automatic thumbnails for images and PDFs via ImageMagick (configurable resolution)\n* ''Thumbnail rendering'' — show thumbnails by default with click-to-expand and toolbar toggle\n* ''File rename'' — renaming a tiddler renames the physical file on writable locations, including `_generated/` thumbnails\n* ''File delete'' — deleting a tiddler offers to delete the file on writable locations, including thumbnails\n* ''Artifact cascade'' — deleting or renaming a file tiddler automatically cascades to all derived artifacts (extractions, summaries, etc.) via `_artifact_source` field\n* ''EXIF extraction'' — automatically extract metadata (date, camera, GPS, dimensions, exposure) from uploaded images and map to tiddler fields. Configurable field mapping per location.\n* ''Deduplication'' — optional global content-hash dedup skips identical uploads\n\n!! Optional integration\n\n* ''scattered-binaries'' — when installed, its discovered locations automatically register with the location registry, enabling artifact cascade for scattered files\n* ''llm-connect'' — when installed, derived artifacts (`.extracted` tiddlers, summaries) are tagged with `_artifact_source` for automatic cascade cleanup\n\n!! Prerequisites\n\n* ImageMagick — required for thumbnail generation and EXIF extraction (`magick` on PATH)\n* Ghostscript — additionally required for PDF thumbnails (`gswin64c` on Windows, `gs` on Linux)\n\n!! Quick start\n\nDrop files onto any `<$file-dropzone>` widget. Configure locations, thumbnail settings, and allowed media types in ControlPanel > Settings > file upload.\n\n```\n<$file-dropzone actions=\"\"\"\n<$action-createtiddler $basetitle=<<filename>>\n  _canonical_uri=<<canonical-uri>>\n  _thumbnail_uri=<<generated-uri>>\n  type=<<type>>/>\n\"\"\">\nDrop files here\n</$file-dropzone>\n```\n\nUpload to a specific location:\n\n```\n<$file-dropzone location=\"my-assets\" actions=\"...\">\nDrop files into my-assets\n</$file-dropzone>\n```\n",
        "requires-reload": "yes",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22maroon%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%3Cpath%20d%3D%22M21%2015v4a2%202%200%200%201-2%202H5a2%202%200%200%201-2-2v-4%22%2F%3E%0A%3Cpolyline%20points%3D%2217%208%2012%203%207%208%22%2F%3E%0A%3Cline%20x1%3D%2212%22%20y1%3D%223%22%20x2%3D%2212%22%20y2%3D%2215%22%2F%3E%0A%3C%2Fsvg%3E"

        "version": "0.1.9",
        "core-version": ">=5.3.0",
        "source": "https://github.com/rimir-cc/tw-filesystem-watcher",

        "type": "application/json",
        "readme": "! filesystem watcher\n\nWatches the tiddlers directory for external filesystem changes (created, modified, deleted by tools like Claude Code) and syncs them into the running wiki in real time.\n\n!! Key features\n\n* ''Live file sync'' — detects file changes via chokidar and updates the wiki store automatically\n* ''Reload alerts'' — yellow alert + red refresh icon for changes requiring a browser reload (module tiddlers, system tiddlers)\n* ''Loop prevention'' — hooks TW's save/delete functions to ignore its own filesystem writes\n* ''CLI mode skip'' — exits immediately when `TIDDLYWIKI_CLI_MODE=1` so CLI imports don't hang\n* ''Ignored tiddlers'' — skips noisy tiddlers like `$:/StoryList` that change frequently and have no value for external sync\n* ''Configurable poll interval'' — bundled default `$:/config/SyncPollingInterval` (override in wiki store to change)\n\n!! Prerequisites\n\n* chokidar (npm dependency, installed with the wiki)\n\n!! Quick start\n\nInstall plugin and `chokidar` npm package. External file changes in the tiddlers directory sync automatically into the running wiki. The poll interval is set via `$:/config/SyncPollingInterval` (default: {{$:/config/SyncPollingInterval}}ms).\n",
        "requires-reload": "yes",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22maroon%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%3Cpath%20d%3D%22M1%2012s4-8%2011-8%2011%208%2011%208-4%208-11%208S1%2012%201%2012z%22%2F%3E%0A%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%223%22%2F%3E%0A%3C%2Fsvg%3E"

        "description": "Embed tiddler fields as YAML frontmatter in markdown files",
        "name": "frontmatter",
        "author": "rimir",
        "version": "0.1.5",
        "core-version": ">=5.3.0",
        "source": "https://github.com/rimir-cc/tw-frontmatter",

        "dependents": "$:/plugins/rimir/theme",
        "soft-dependents": "$:/plugins/rimir/doc-template",
        "type": "application/json",
        "readme": "! Frontmatter\n\nStore tiddler metadata as YAML frontmatter directly inside `.md` files — no `.meta` sidecar needed. Any `.md` file with YAML frontmatter is automatically detected and re-parsed at boot.\n\n!! Features\n\n* ''Auto-detection'' — any `.md` file with `---` delimited YAML frontmatter is recognized automatically\n* ''Title derivation'' — frontmatter `title` field > existing clean title > derived from filepath\n* ''Syncer-safe'' — change events suppressed during re-parse to prevent file corruption\n* ''Two-pass re-parse'' — handles both boot-loaded files and `tiddlywiki.files` entries\n* ''YAML serialization'' — tags and list fields serialized as YAML arrays\n* ''Orphan cleanup'' — automatic removal of orphaned `.meta` files when migrating\n* ''Filesystem-watcher compatible'' — live external edits work seamlessly\n\n!! Prerequisites\n\n* TiddlyWiki 5.3.0+ (Node.js server edition)\n* The official `tiddlywiki/markdown` plugin (for rendering)\n\n!! Quick Start\n\n# Set a tiddler's type to `text/x-frontmattered-markdown`\n# The tiddler is saved as a `.md` file with YAML frontmatter on disk\n# Or place any `.md` file with YAML frontmatter in your tiddlers directory — it is auto-detected at boot\n",
        "requires-reload": "yes",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22maroon%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M14%202H6a2%202%200%200%200-2%202v16a2%202%200%200%200%202%202h12a2%202%200%200%200%202-2V8z%22%2F%3E%3Cpolyline%20points%3D%2214%202%2014%208%2020%208%22%2F%3E%3Cline%20x1%3D%228%22%20y1%3D%2213%22%20x2%3D%2216%22%20y2%3D%2213%22%2F%3E%3Cline%20x1%3D%228%22%20y1%3D%2217%22%20x2%3D%2216%22%20y2%3D%2217%22%2F%3E%3Cline%20x1%3D%228%22%20y1%3D%229%22%20x2%3D%2210%22%20y2%3D%229%22%2F%3E%3C%2Fsvg%3E%0A"

        "title": "$:/plugins/rimir/git-int",
        "description": "Git version control integration for the TiddlyWiki editor",
        "name": "git integration",
        "author": "rimir",
        "version": "0.1.10",
        "core-version": ">=5.3.0",
        "source": "https://github.com/rimir-cc/tw-git-int",
        "plugin-type": "plugin",
        "list": "readme documentation settings changelog license",
        "dependents": "$:/plugins/rimir/theme",
        "soft-dependents": "$:/plugins/rimir/doc-template",
        "type": "application/json",
        "readme": "! git integration\n\nGit version control for individual tiddlers from within the TiddlyWiki editor. Commit, diff, restore, and stash changes without leaving edit mode.\n\n!! Key features\n\n* ''Inline diff'' — view current changes vs. last commit side by side\n* ''Commit'' — commit individual tiddlers with a commit message\n* ''Stash'' — stash/unstash and inspect stashed changes\n* ''Restore'' — restore tiddler content to any previous version\n* ''Draft-aware'' — works with unsaved edits (browser sends draft fields to server)\n* ''Multi-repo'' — automatically detects which git repo each tiddler belongs to (supports nested repos)\n* ''Toolbar button'' — accessible from the edit toolbar\n\n!! Prerequisites\n\n* Git installed and available on the server's PATH\n* Tiddlers directory (or subdirectories) must be inside a git repository\n\n!! Quick start\n\nInitialize git in your tiddlers directory (or use separate repos for subdirectories like `tiddlers/work/` and `tiddlers/private/`). Open any tiddler in edit mode and click the git icon in the toolbar to access diff, commit, and stash operations.\n",

        "readme": "! json dsl\n\nDeclarative JSON builder widgets for TiddlyWiki. Compose JSON structures using widget syntax instead of string manipulation.\n\n!! Key features\n\n* ''Composable widget set'' — `<$json-obj>`, `<$json-array>`, `<$json-prop>`, `<$json-val>`, `<$json-item>`\n* ''Output widgets'' — emit to tiddler field (`<$json-save>`) or action variable (`<$json-emit>`)\n* ''Debug widget'' — `<$json-debug>` for inspecting output during development\n* ''Widget tree integration'' — seamless integration with TiddlyWiki's widget tree and filter expressions\n\n!! Prerequisites\n\nNo external prerequisites.\n\n!! Quick start\n\nBuild JSON declaratively: `<$json-obj><$json-prop key=\"name\" value=\"hello\"/><$json-emit/></$json-obj>`.\n",

    {
        "title": "$:/plugins/rimir/kind",
        "description": "Lightweight schema engine for TiddlyWiki — one tiddler per type, namespaced, hand-rolled UI",
        "name": "kind",
        "author": "rimir",
        "version": "0.1.67",
        "core-version": ">=5.4.0",
        "source": "https://github.com/rimir-cc/tw-kind",
        "plugin-type": "plugin",
        "list": "readme documentation settings overview type-builder creator validator changelog license",
        "dependents": "$:/plugins/rimir/scribe",
        "soft-dependents": "$:/plugins/rimir/doc-template $:/plugins/rimir/cascade-palette",
        "type": "application/json",
        "readme": "! kind\n\nLightweight schema engine for TiddlyWiki. Define each type's fields, constraints, title formula, and namespace memberships on a single tiddler. Spawn, edit, view, and validate typed instances through hand-rolled UIs with zero plugin dependencies.\n\n!! Key features\n\n* ''One tiddler per type'' — schema lives in fields and a JSON-encoded `kind.fields` array on a single tiddler; body stays free for prose documentation\n* ''Namespaces'' — types declare `kind.namespaces` (multi-membership); a namespace switcher scopes what's visible\n* ''Auto-computed titles'' — types declare a `kind.title-formula` filter; new instances get their title computed from sibling fields\n* ''Live + bulk validation'' — inline errors as you edit, plus a wiki-wide validator report\n* ''Typeahead refs'' — filterable text input + dropdown + selected pills with × remove; scales to large option sets\n* ''Configurable stream-river view'' — each type chooses which fields appear in its in-river field bar; empty = bar hidden\n* ''Instances Overview graph'' — open the ''[[Kind: Instances Overview]]'' tiddler for a whole-wiki graph of every instance, coloured per type, with toggleable per-ref-field edges and per-type show/hide; drag nodes to lay them out and positions persist. The hover tooltip offers per-node ''edit'' (live field editor in a modal), ''delete'' (confirm dialog; disabled with a hint while the node still has `parent`-field children) and ''Add child'' buttons for every kind whose `parent` field accepts the node's type — the create form opens with the parent pre-filled and the same validation as the Creator (needs a graph engine — see Prerequisites)\n* ''Context preview'' — a cascade-palette side-preview (shown for any instance) that draws just the instance's neighbourhood in the parent-tree, reusing the Instances Overview layout/positions. Pills pick direction (''Descendants'' / ''Ancestors''), how many ''levels'' (1–5) to show, which ''edges'' to draw (multi-select), and which ''types'' to show (colour-coded chips — click to hide); all four persist globally. Edges are colour- and stroke-coded per relationship and labelled when more than one is shown (needs a graph engine + the bimlas kin-filter plugin — see Prerequisites)\n* ''Hand-rolled UI'' — zero dependency on other rimir plugins (theme/components/typed)\n* ''Cascade-palette integration'' — when `rimir/cascade-palette` ≥ 0.0.79 is installed, kind ships a bridge config (`kind.type` as the entity-type field) so any action declaring `ca-entity-type: <X>` automatically surfaces on Space against any tiddler with `kind.type: <X>` in any view. The four bundled instance-actions (Open, Edit fields, Edit kind schema, Delete) also carry `ca-applies: [<currentTiddler>has[kind.type]]`, so they show up on any kind-instance row regardless of its specific type\n\n!! Prerequisites\n\nNo external prerequisites for the core schema/UI. Optional: `$:/plugins/rimir/doc-template` for the branded documentation hub; `$:/plugins/flibbles/graph` plus a rendering engine (`flibbles/vis-network` or `rimir/cytoscape-engine`) for the ''Instances Overview'' graph (it shows an install hint if absent). The ''Context'' side-preview additionally needs the `$:/plugins/bimlas/kin-filter` plugin (it walks the `parent` tree to a chosen depth).\n\n!! Quick start\n\n# Open the ''type-builder'' tab and define a new type (key, caption, icon, namespaces, title-formula, fields JSON).\n# Open the ''creator'' tab, pick the type, fill the fields, click Create.\n# Open the resulting tiddler in the story river — the stream-view field bar appears at the top.\n# Use the ''validator'' tab for a wiki-wide constraint scan.\n",
        "requires-reload": "no",

        "title": "$:/plugins/rimir/knowledge-app",
        "description": "Zettelkasten-style knowledge app on top of namespace + appify",
        "name": "knowledge app",
        "author": "rimir",
        "version": "0.1.23",
        "core-version": ">=5.4.0",
        "plugin-type": "plugin",
        "dependents": "$:/plugins/rimir/appify $:/plugins/rimir/mindmap $:/plugins/rimir/namespace $:/plugins/rimir/statewrap $:/plugins/rimir/theme",
        "soft-dependents": "$:/plugins/rimir/doc-template $:/plugins/rimir/mindmap-elixir",
        "list": "readme documentation settings changelog license",
        "type": "application/json",
        "readme": "! Knowledge App\n\nA zettelkasten-style note app for TiddlyWiki. Notes live under the `knowledge/…` title namespace and link via short refs (`[[Foo]]`) thanks to the `rimir/namespace` plugin.\n\n!! Why\n\nDeep folder hierarchies (`knowledge/topics/programming/typescript/Foo`) are great for organisation but hostile to fluent linking. The namespace plugin already resolves short refs by walking up the source tiddler's path; this app gives those notes a proper home with browse / backlinks / quick-capture / maintenance views.\n\n!! Features\n\n* ''Areas'' — first-class knowledge areas (LLM, IT-Security, Health, Gaming + user-creatable) live as `knowledge/<area>/…`. Topbar pill row switches between them; quick-capture and the `\\context` line follow the active area automatically. Cross-area linking works out of the box via namespace walk-up.\n* ''Quick-capture'' — title + body modal in the topbar; new notes land at `knowledge/<area>/inbox/…` (or `knowledge/inbox/…` when no area is active) with the right `\\context` pragma pre-set. Title autocomplete suggests existing matches; duplicate titles disable the Create button.\n* ''Type-specific forms'' — note types can ship a capture form (extra fields shown in the modal) and a render form (structured display in the Note view). First example: ''source'' adds caption / author / medium / URL / published / consume-status / consume-date, with a YouTube embed (small / medium / large player) and per-row pen-icon inline editing.\n* ''Three-tier status'' — fleeting, developing, evergreen (TZK-style). One click to promote.\n* ''Backlinks panel'' — reads namespace's reverse index (no setup needed).\n* ''Write tab'' — orphans, stubs, dead-ends, broken refs. Maintenance at a glance.\n* ''Search'' — incremental search over title + text.\n* ''Mount `kn`'' — orga / priv / any tiddler can write `[[kn/topics/foo]]` to reach knowledge content.\n* ''Custom pseudo `_index''' — `[[knowledge/topics/foo/_index]]` resolves to that topic's `index` or `README` tiddler. (The pseudo expands inside an absolute ref; bare `[[_index]]` does not auto-find the current topic's index.)\n\n!! Prerequisites\n\n* [[appify|$:/plugins/rimir/appify]] — app platform\n* [[namespace|$:/plugins/rimir/namespace]] — short-ref resolution\n* [[theme|$:/plugins/rimir/theme]] — shared `rr-` styles\n* [[doc-template|$:/plugins/rimir/doc-template]] (soft) — full documentation hub\n\n!! Quick start\n\n# Open the FAB and pick \"Knowledge\".\n# Click the +Note button in the topbar; type a title and (optionally) some body wikitext.\n# The note opens. Type `[[Foo]]` somewhere to link a (possibly future) note.\n# Open the Write tab to see orphans / stubs / dead-ends / broken refs.\n\nThe plugin enables four namespace feature flags on install (walk-up, aliases, pseudo-expansion). Toggle them in the namespace plugin's settings if you ever need to disable them.\n",

        "title": "$:/plugins/rimir/llm-connect",
        "description": "In-browser LLM integration with tool use — connect TiddlyWiki to Claude, OpenAI, Azure, and other LLM APIs",
        "author": "rimir",
        "version": "0.1.54",
        "core-version": ">=5.3.0",
        "source": "https://github.com/rimir-cc/tw-llm-connect",
        "name": "llm connect",
        "plugin-type": "plugin",
        "list": "readme documentation settings changelog license",
        "dependents": "$:/plugins/rimir/theme",
        "soft-dependents": "$:/plugins/rimir/doc-template $:/plugins/rimir/file-pipeline $:/plugins/rimir/runner $:/plugins/rimir/llm-help",
        "type": "application/json",
        "readme": "! llm connect\n\nIn-browser LLM integration with tool use. Connect TiddlyWiki to Claude, OpenAI, Azure, and other LLM APIs — the wiki acts as the orchestrator: sends prompts, receives tool calls, executes them against `$tw.wiki`, and returns results. No server required.\n\n!! Key features\n\n* ''Two modes'' — interactive chat (multi-turn, tool use) and one-shot actions (context template → LLM → output target)\n* ''Pair editing'' — toolbar button opens an embedded chat panel on any tiddler for collaborative editing with the LLM\n* ''Provider adapters'' — Claude, OpenAI, and Azure OpenAI out of the box, extensible for other providers\n* ''Dynamic model selection'' — fetch available models from provider APIs; per-chat model selector with provider locking\n* ''Tool system'' — built-in tools for searching, reading, navigating, and modifying tiddlers; user-defined tools via wikitext. `create_tiddler` supports `basetitle` for auto-numbered titles\n* ''Per-chat tool selection'' — wrench icon opens a dropdown to toggle individual tools per chat; tool groups as quick presets\n* ''Help context selector'' — question mark icon (requires llm-help plugin) opens a dropdown to toggle llm-help context keys, with All/None quick buttons and configurable context groups\n* ''Multimodal context'' — attach PDFs, images, and text tiddlers to conversations via a context filter; binary files are fetched, base64-encoded, and sent inline to the LLM\n* ''Document extraction'' — PDF/DOCX/XLSX auto-converted to markdown text via pdftotext/pandoc/openpyxl before sending to the LLM. Cached per document. Falls back to base64 when runner is unavailable\n* ''Model tier routing'' — assign cost tiers (cheap/default/expensive) to tools; orchestrator auto-switches models per tool round. Toggle via layers icon in chat header\n* ''Context templates'' — wikitext templates that render input for the LLM from one or more source tiddlers\n* ''Output targets'' — write LLM responses to fields, new tiddlers, or just display in chat\n* ''Debug panel'' — toggle a live preview of the request payload or inspect the last sent request; base64 data abbreviated for readability\n* ''Resizable chat'' — drag the chat panel edges or the chat history resize handle to adjust layout\n* ''Markdown rendering'' — assistant messages are rendered as formatted markdown (tables, code blocks, lists, etc.) using the TiddlyWiki markdown plugin\n* ''Collapsible tool messages'' — tool call and result messages are collapsed by default; click to expand individually or use the ⚙️ toggle for all\n* ''Tiddler protection'' — allow/deny modes with restricted wiki proxy. Base protection filter (always enforced, both modes) + hard protection filter (final safety net after all user input) ensure `tag[sensitive]` tiddlers are never accessible. Per-chat mode and filter overrides via shield icon; switching modes auto-negates the filter. Widget-level `allowFilter`/`denyFilter`/`protectionMode` attributes for recipe panels\n* ''Plugin visibility'' — tick plugins in settings to exclude their shadow tiddlers from LLM access (all readable by default)\n* ''Accessible tiddlers panel'' — eye icon (👁️) shows a live list of all tiddlers (including shadows) the LLM can currently access based on the active protection filter. Drop tiddlers onto the panel to grant access (adds to whitelist in allow mode, exempts from blacklist in deny mode)\n* ''Chat export/import'' — arrow buttons in the chat header export the entire conversation as JSON to the clipboard, or import a previously exported chat from the clipboard (falls back to a paste dialog if clipboard read access is denied). All state is preserved: messages, provider, model, tool selection, protection filters, and context\n* ''Chat pin/save/restore'' — 📌 icon pins a chat to persist it to disk. Pinned chats auto-sync all state on every change. Restore saved chats after browser reload or server restart. One save slot per widget context (global chat, chat view, each pair-edit tiddler)\n* ''Audit logging'' — write operations (set-field, create, delete) execute immediately with an audit log\n\n!! Prerequisites\n\n* An API key for at least one supported provider (Claude, OpenAI, or Azure OpenAI)\n* A modern browser (async/await support)\n\n!! Quick start\n\n# Install the plugin and configure your API key in Settings\n# Open the chat from the page toolbar button\n# Ask a question — the LLM can search and read your wiki via tools\n# Click the pair-edit button in any tiddler's toolbar to start a collaborative editing session\n\nFor one-shot actions, add a button to any tiddler:\n\n```\n<$button>\n  Summarize\n  <$llm-action\n    tiddler=<<currentTiddler>>\n    prompt=\"Summarize the most important points in 3 bullets.\"\n  />\n</$button>\n```\n",
        "requires-reload": "yes",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22maroon%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%3Cpath%20d%3D%22M21%2015a2%202%200%200%201-2%202H7l-4%204V5a2%202%200%200%201%202-2h14a2%202%200%200%201%202%202z%22%2F%3E%0A%3Ccircle%20cx%3D%229%22%20cy%3D%2210%22%20r%3D%221%22%20fill%3D%22maroon%22%20stroke%3D%22none%22%2F%3E%0A%3Ccircle%20cx%3D%2212%22%20cy%3D%2210%22%20r%3D%221%22%20fill%3D%22maroon%22%20stroke%3D%22none%22%2F%3E%0A%3Ccircle%20cx%3D%2215%22%20cy%3D%2210%22%20r%3D%221%22%20fill%3D%22maroon%22%20stroke%3D%22none%22%2F%3E%0A%3C%2Fsvg%3E%0A"

        "title": "$:/plugins/rimir/llm-help",
        "description": "Self-discoverable hierarchical help system for LLM interactions — lets LLMs browse context-aware documentation to solve wiki tasks autonomously",

        "version": "0.1.30",
        "core-version": ">=5.3.0",
        "source": "https://github.com/rimir-cc/tw-llm-help",

        "type": "application/json",
        "readme": "! LLM Help\n\nA self-discoverable, hierarchical help system that lets LLMs browse context-aware documentation to solve wiki-specific tasks autonomously.\n\n!! How it works\n\nThe plugin provides a single MCP tool `llm_help` that LLMs call to navigate a tree of help pages:\n\n* `llm_help()` -- returns top-level help categories\n* `llm_help(\"data-model\")` -- navigates deeper into a category\n* `llm_help(\"data-model/person/create\")` -- reaches a specific help page\n\nEach level returns child topics with descriptions, so the LLM decides where to go based on its current task. Help pages can contain dynamic content -- rendered at call time from the wiki's live state (e.g., typed data schemas, existing instances).\n\n!! Key features\n\n* ''Hierarchical navigation'' -- help pages organized in a tree of any depth\n* ''Dynamic content'' -- pages rendered as wikitext at call time, pulling live data from the wiki\n* ''Context-aware'' -- pages can be scoped to specific contexts (e.g., an appify app)\n* ''Multi-path mounting'' -- same page reachable from multiple paths in the tree\n* ''Plugin-extensible'' -- any plugin can contribute help pages via tagged tiddlers\n* ''User shortcuts'' -- users can add quick-reference help pages via the settings UI\n* ''Context selector'' -- settings popup to toggle active context keys with page counts\n* ''Help browser'' -- settings tab lets users see and navigate what the LLM sees\n\n!! For plugin authors\n\nTo add help pages from your plugin, create shadow tiddlers with:\n\n* Tag: `$:/tags/rimir/llm-help/page`\n* Field `llm-help-path`: navigation path (space-separated for multiple paths)\n* Field `llm-help-description`: one-line description shown in parent listings\n* Optional `llm-help-sort`: numeric sort order within siblings\n* Optional `llm-help-context`: space-separated context keys (page hidden when context doesn't match)\n\nPages with no `llm-help-context` are always visible. Pages with a context are only visible when the active context matches.\n\n!! Requirements\n\n* [[$:/plugins/rimir/llm-connect]] -- provides the MCP tool infrastructure\n* [[$:/plugins/rimir/theme]] -- provides UI styling classes\n",
        "requires-reload": "no",
        "icon": "data:image/svg+xml,%3Csvg%20width%3D%2222pt%22%20height%3D%2222pt%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22maroon%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%2210%22%2F%3E%0A%3Cpath%20d%3D%22M9.09%209a3%203%200%200%201%205.83%201c0%202-3%203-3%203%22%2F%3E%0A%3Cline%20x1%3D%2212%22%20y1%3D%2217%22%20x2%3D%2212.01%22%20y2%3D%2217%22%2F%3E%0A%3C%2Fsvg%3E%0A"

        "title": "$:/plugins/rimir/mindmap",

        "list": "readme documentation settings views producers flags changelog license",
        "type": "application/json",
        "readme": "! mindmap\n\nEngine-agnostic mindmap rendering for TiddlyWiki. Provides a canonical mindmap document model (MDOM), a per-view overlay layer for layout/restructuring that does not write back to wiki data, and a pluggable adapter contract for visualization libraries.\n\n!! Key features\n\n* ''Engine-agnostic'' — pluggable adapters via `module-type: mindmapengine`. Ships with no built-in engine; install a companion plugin such as `rimir/mindmap-elixir` to render.\n* ''Three producer mechanisms'' — `module-type: mindmap-producer` modules, JSON MDOM tiddlers, or a `filter=` quick form. All feed the same canonical document.\n* ''Base + overlay model'' — view-specific positioning, hides, reparenting and custom nodes ride in a separate overlay tiddler (ordered op log). Multiple views over the same base data are first-class.\n* ''Structural editing (write-back)'' — producers that declare `capabilities.structural` translate drag-rename / drag-reparent / addNode / removeNode into real wiki mutations (`renameTiddler` cascades references via flibbles/relink; `addTiddler`/`deleteTiddler` for create/destroy). Cascade-confirm modal guards large operations. Focus mode drills into subtrees.\n* ''Stable IDs with rename rescue'' — producers assign deterministic IDs; orphaned overlay ops survive upstream renames and surface a manual prune action rather than silently disappearing.\n* ''Forward-compatible with slide mode'' — the overlay op vocabulary doubles as the slide-ops vocabulary for the planned presentation player.\n* ''Filter-driven flag decoration'' — author plain tiddlers tagged `$:/tags/rimir/mindmap/flag` to attach icons, colour, border, font-weight, italic, uppercasing, opacity, etc. to nodes that match a filter. Aggregation rolls flags up to synthetic chain/axis ancestors. See the //Flags// tab.\n\n!! Prerequisites\n\n* TiddlyWiki 5.3.0+\n* At least one installed engine plugin (e.g. `$:/plugins/rimir/mindmap-elixir`).\n\n!! Quick start\n\n# Install this plugin alongside an engine plugin.\n# Create a view tiddler with fields `mm.producer`, `mm.args`, `mm.engine`, `mm.overlay`.\n# Render with `<$mindmap view=\"MyView\"/>`.\n\nFor a one-off mindmap of any filter:\n\n```\n<$mindmap filter=\"[tag[Knowledge]]\" engine=\"MindElixir\" overlay=\"MyMap/overlay\"/>\n```\n",
        "requires-reload": "yes",
        "icon": "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%20width%3D%2248%22%20height%3D%2248%22%3E%0A%20%20%3Ccircle%20cx%3D%2264%22%20cy%3D%2264%22%20r%3D%2214%22%20fill%3D%22%23FFD27A%22%20stroke%3D%22%238B5E00%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2220%22%20cy%3D%2230%22%20r%3D%229%22%20fill%3D%22%23A8D5FF%22%20stroke%3D%22%231F5FB0%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2220%22%20cy%3D%2298%22%20r%3D%229%22%20fill%3D%22%23A8D5FF%22%20stroke%3D%22%231F5FB0%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%22108%22%20cy%3D%2230%22%20r%3D%229%22%20fill%3D%22%23C6F0C6%22%20stroke%3D%22%232E7A2E%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%22108%22%20cy%3D%2298%22%20r%3D%229%22%20fill%3D%22%23C6F0C6%22%20stroke%3D%22%232E7A2E%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%22108%22%20cy%3D%2264%22%20r%3D%227%22%20fill%3D%22%23FBC0C0%22%20stroke%3D%22%23A0322F%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M50%2060%20C%2038%2050%2C%2032%2038%2C%2028%2032%22%20fill%3D%22none%22%20stroke%3D%22%238B5E00%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M50%2068%20C%2038%2078%2C%2032%2090%2C%2028%2096%22%20fill%3D%22none%22%20stroke%3D%22%238B5E00%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M78%2060%20C%2090%2050%2C%2096%2038%2C%20100%2032%22%20fill%3D%22none%22%20stroke%3D%22%238B5E00%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M78%2068%20C%2090%2078%2C%2096%2090%2C%20100%2096%22%20fill%3D%22none%22%20stroke%3D%22%238B5E00%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M78%2064%20L%20100%2064%22%20fill%3D%22none%22%20stroke%3D%22%238B5E00%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E%0A"

        "readme": "! mindmap elixir\n\n[[mind-elixir|https://github.com/SSShooter/mind-elixir-core]] engine adapter for [[rimir/mindmap|$:/plugins/rimir/mindmap]]. Registers as a `module-type: mindmapengine` so any `<$mindmap>` widget can render via mind-elixir.\n\n!! Key features\n\n* ''Drop-in adapter'' — install alongside `rimir/mindmap`, select `MindElixir` as the default engine\n* ''Tree-native rendering'' — radial layout, expand/collapse, focus, drag with mind-elixir's defaults\n* ''Round-trip safe'' — unknown-namespace attrs (`mx:*`, `kn:*`, etc.) survive engine swaps\n* ''Bundled library'' — mind-elixir UMD + CSS shipped inside the plugin; no CDN or build step\n\n!! Prerequisites\n\n* `$:/plugins/rimir/mindmap`\n* TiddlyWiki 5.3.0+\n\n!! Quick start\n\n# Install both `rimir/mindmap` and this plugin.\n# Set `$:/config/rimir/mindmap/default-engine` to `MindElixir` (or leave empty — it's the only engine, the widget picks it up automatically).\n# Render any view: `<$mindmap view=\"MyView\"/>`.\n\n!! Bundled version\n\nmind-elixir v5.11.0 (MIT-licensed). See `changelog` for upgrades.\n",

        "type": "application/json",
        "readme": "! minver — browser-side tiddler versioning\n\nKeep snapshot versions of your tiddlers directly in the browser. Snapshots are stored compressed in localStorage and survive page reloads.\n\n!! Key features\n\n* ''Manual snapshots'' — take a snapshot anytime from the editor preview pane\n* ''Auto-snapshots'' — automatically captures the previous version on every save\n* ''Auto-snapshots on create/delete'' — automatically captures initial state on creation and final state on deletion\n* ''Diff view'' — per-field comparison with `<$diff-text>`, integrated as an editor preview type\n* ''Field-level rollback'' — revert individual fields or the entire tiddler\n* ''Manager revert'' — revert any snapshot directly from the manager\n* ''Change-groups'' — record a session of changes (creates, edits, deletes) and review/rollback them as a unit\n* ''Compressed storage'' — uses native CompressionStream to minimize localStorage usage\n* ''Export/Import'' — transfer snapshots between wikis via a single JSON tiddler\n\n!! Quick start\n\n!!! Snapshots\n\n# Open any tiddler for editing\n# Click the eye icon in the editor toolbar and select \"snapshots\"\n# Click \"Take snapshot\" to create a manual snapshot\n# Edit the tiddler, then select your snapshot to see the diff\n# Use the undo button next to any field to revert it\n\n!!! Change-groups\n\n# Click the record button (&#x25cf;) in the page toolbar to start recording changes\n# Make your edits (create, modify, delete tiddlers)\n# Click stop (&#x25a0;) to finish — view your change-group in the \"groups\" plugin tab\n# Use \"Rollback\" to undo all changes in the group\n\n!! Prerequisites\n\n* TiddlyWiki 5.3.0+\n* Theme plugin (`$:/plugins/rimir/theme`)\n* A modern browser with CompressionStream support (Chrome 80+, Firefox 113+, Safari 16.4+)\n",
